# パイプラインの検査を CI で回す。
#
# **ネットワークを叩く取得（ingestion）は回さない。**
# 原典を Parquet で commit してあるので、変換・配布物の生成・検査はそこから再現できる。
# 「原典から成果物を再生成できる」という再現性の定義が、そのまま CI の内容になる。
#
# 最後に `git diff --exit-code` で、再生成しても commit 済みの成果物と一致することを確かめる。
# 一致しなければ、コードと配布物のどちらかが手で触られている。
name: verify

on:
  pull_request:
  push:
    branches: [main]

# llama.cpp は ingestion の OCR（歳入科目名の抽出）だけが使う。CI は ingestion を回さないので、
# 数百MB を落とさせない。
# ⚠️ **`mise-action` の `install_args` で入れるものを列挙しない。**
# それはツールの宣言を mise.toml と workflow の2箇所に割ることになり、
# 新しいツールを足したとき CI 側の追従を誰も検査しない。除外の側を書けば宣言は1箇所のまま。
env:
  MISE_DISABLE_TOOLS: llama.cpp

jobs:
  # ①予算のパイプライン。取得（ingestion）はネットワークを叩くので回さない。
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: 2026.8.6

      - name: 依存を入れる
        run: |
          uv sync --frozen
          # workspaces なので root の install が apps/web の依存も入れる
          bun install --frozen-lockfile

      - name: 型検査
        run: |
          bun run typecheck
          bun run --cwd apps/web typecheck

      - name: 変換と検査（dbt）
        run: bun run dbt

      - name: 配布物を組み立てる
        run: uv run python -m fdp.build

      # apps/api は data/budget/datapackages/ を読んで配布物の宣言（AMOUNT_PHASE、levelName の enum など）を
      # 手で持っている。団体を足したとき配布物側だけ更新して apps/api 側を足し忘れると、
      # ここより後ろのどのステップも検知できない（実際に PR #18 で発生し、CI green のまま main が壊れた）。
      # `test` script は `bun run build && bun test` なので、build と test の両方をここで検査する。
      - name: apps/api のビルドと検査
        run: bun run --cwd apps/api test

      - name: 報告を作る
        run: bun run report

      - name: 画面をビルドする
        run: bun run --cwd apps/web build

      - name: 再生成しても commit 済みの成果物と一致するか
        run: |
          if ! git diff --exit-code -- data/budget/; then
            echo "::error::再生成した成果物が commit 済みのものと一致しない。"
            echo "::error::bun run pipeline を回して差分を commit してください。"
            exit 1
          fi

  # ①予算のパイプラインとは別物。**commit 済みデータが宣言と食い違っていないか**を見る。
  # ③会議録のゲート判定は取得も変換もまだ実装が無いが、判定そのものは commit してあるので、
  # 誰かが編集したときに壊れるのを止める必要がある。
  data-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile

      - name: ③会議録のゲート判定（62団体）を宣言と、団体 registry とコード集合で突き合わせる
        run: bun run validate
