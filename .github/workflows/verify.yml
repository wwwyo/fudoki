name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_DISABLE_TOOLS: llama.cpp
jobs:
  fixture-and-code:
    name: Synthetic fixture and code (not full fiscal build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
      - run: bun run typecheck:all
      - run: bun run test
      - run: uv run python -m unittest discover -s pipeline/ingestion -p '*_test.py'
      - run: bun run validate
      - run: bun run build:web
      - run: bun run build:api
      - run: bun run build:download
      - run: bun run build:verification
      - run: bun run build:docs
      - run: bun run pipeline/verify/boundaries.ts
      - name: 検証範囲を表示
        run: echo '架空団体の fixture とコードの検証。非公開原典の全量 dbt build は別 job。' >> "$GITHUB_STEP_SUMMARY"
  full-fiscal:
    name: Full fixed fiscal inputs from private R2
    # R2 転送・正規の入力一覧の固定・CI credentials の設定が済んだ後に有効化する。
    if: vars.FUDOKI_FIXED_INPUTS_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          version: 2026.8.6
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
      - name: 正規の固定入力だけを復元
        run: bun run pipeline:inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FUDOKI_INPUTS_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: オフライン全量 build と報告
        run: |
          bun run pipeline:build
          bun run pipeline:report
      - name: 公開用の件数・金額・ファイルハッシュを記録
        run: bun run pipeline/verify/summary.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fiscal-release-validation
          path: |
            pipeline/build/review-summary.json
            pipeline/build/releases/*/manifest.json
