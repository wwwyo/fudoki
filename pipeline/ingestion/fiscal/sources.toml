# ⚠️ **説明欄の金額には単位が付く**（`316,980 千円`）。行末が数字で終わらないので、
# 単位を落としてから右揃えの数字を切り出す。落とせない行（自由記述の `21,400人`・
# `3,000円`・`98.0％`）はそこで弾かれる — **単位そのものが項目の目印になる**。
[statement."131016:2026".explanation.expenditure]
model = "nested"
# 段は2つ（事業 → 内訳）。昭島市のように説明欄の中に節は現れない
levels = { project = 532, detail = 514 }
tolerance = 2
amount_suffix = "千円"
# ⚠️ **項目に通し番号が振られている**（`１ 議員報酬（区議会事務局）` / `（１） 議会ホームページ運営`）。
# 番号は目の中での並び順しか表しておらず（並びは source_row が保つ）、
# 落とさないと年度をまたいで番号がずれ、同じ事業が別の名前に見える。
# ⚠️ **自動判定にしない** — 番号を振らない団体では `1歳6か月児健診` のような名前を削ってしまう。
numbered = true

[statement."131016:2026".explanation.revenue]
model = "nested"
levels = { project = 530 }
tolerance = 2
amount_suffix = "千円"
numbered = true

