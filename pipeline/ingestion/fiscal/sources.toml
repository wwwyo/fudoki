# ⚠️ **節が左頁にある。** 昭島市は右頁に節と説明が並ぶが、千代田区は左頁に
# 目・財源内訳・節が入り、右頁は説明欄だけの1頁になる。見開きとして扱う点は同じ。
[statement."131016:2026".left_page_columns]
expenditure = ["moku", "setsu_code", "setsu"]
revenue = ["moku", "setsu_code", "setsu"]

