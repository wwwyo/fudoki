version: 2

models:
  - name: stg_132047__expenditure
    description: 三鷹市 歳出。原典と1対1。判断を含まない
    columns: &staging_columns
      - name: source_row
        description: |
          原典の行番号（ヘッダを1行目とする）。**1リソース内でしか一意でない。**
          年度をまたぐと衝突するので、join にも一意性検査にも使わない（証跡として持つだけ）。
        data_tests: [not_null]
      - name: source_amount
        description: |
          原典の値。単位は団体ごとに違う（三鷹市は千円、狛江市の歳出は円、歳入は千円）。
          `fiscal_amounts` で primary と宣言した段階の金額で、COFOG の集計と検算はこれを使う。
        data_tests: [not_null]
      - name: fiscal_line_id
        description: |
          安定キー。**公開 API の一部**なので導出を変えると配布済みの参照が壊れる。
          コードのパスではなくセル全文から導く（細々節は兄弟間でコードを再利用するため）。
          階層だけで一意にならない団体では、追加の同一性の列も材料に入れる
          （狛江市は所属と予算区分）。
        data_tests: [unique, not_null]

  - name: stg_132047__revenue
    description: 三鷹市 歳入。原典と1対1。判断を含まない
    columns: *staging_columns

  - name: stg_132195__expenditure
    description: 狛江市 歳出（決算書）。原典と1対1。判断を含まない
    columns: *staging_columns

  - name: stg_132195__revenue
    description: 狛江市 歳入（決算書）。原典と1対1。判断を含まない
    columns: *staging_columns

  # ⚠️ **多摩市はここに登録されていなかった。** 収録した PR で足し忘れたまま、
  # `source_amount` の not_null も `fiscal_line_id` の unique も一度も掛かっていなかった。
  # ⚠️ **この形（団体ごとに手で登録する）は足し忘れを止められない。** 金額が解けているかは
  # 宣言を母集団にする tests/amounts_resolve_for_every_row.sql が全団体を見る。
  - name: stg_131016__expenditure
    description: 千代田区 歳出（当初予算）。**原典は PDF の事項別明細書**。抽出した表と1対1で、判断を含まない
    columns: *staging_columns

  - name: stg_131016__revenue
    description: 千代田区 歳入（当初予算）。**原典は PDF の事項別明細書**。抽出した表と1対1で、判断を含まない
    columns: *staging_columns

  - name: stg_132071__expenditure
    description: 昭島市 歳出（当初予算）。**原典は PDF の事項別明細書**。抽出した表と1対1で、判断を含まない
    columns: *staging_columns

  - name: stg_132071__revenue
    description: 昭島市 歳入（当初予算）。**原典は PDF の事項別明細書**。抽出した表と1対1で、判断を含まない
    columns: *staging_columns

  - name: stg_132241__expenditure
    description: 多摩市 歳出（当初予算）。原典と1対1。判断を含まない
    columns: *staging_columns

  - name: stg_132241__revenue
    description: 多摩市 歳入（当初予算）。原典と1対1。判断を含まない
    columns: *staging_columns

  - name: stg_132195__budget_history
    description: 狛江市2023年度一般会計の当初・補正・議決結果・決算書確認値。取り込みと1対1、円換算前
    columns:
      - name: fiscal_line_id
        description: 団体・年度・方向・文書種別・原典hash・表ID・抽出行番号の組合せ
      - name: source_row
        description: 一採用資料の一抽出表で振った行番号。CSV物理行・PDFページとは別
      - name: initial_text
        description: 当初予算書の本年度予算額の印字文字列。千円
      - name: delta_text
        description: 各号の目の補正増減額の印字文字列。千円、△は減額
      - name: reported_amount_text
        description: 決算書の目の予算現額を目視確認した文字列。円
      - name: executed_amount_text
        description: 決算書の目の支出済額を目視確認した文字列。円
      - name: page_number
        description: 原典PDFの1始まりの物理ページ
      - name: bbox_json
        description: PDFの行の文字座標。未確認の手動転記・議決行では空配列
