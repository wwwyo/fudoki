version: 2
sources:
  - name: raw_132071_settlement2020_2023
    description: |
      昭島市 令和2〜令和5年度決算書（全項）のネイティブ有限復元。節列を持つ歳出明細、
      独立した事業備考合計、非加算の印刷統制、全会計合計の制御行、各年度の物理頁棚卸。
      4年度分の原典 PDF バイトは固定入力であり、候補表や診断出力は入力ではない。
      令和2年度（FY2020）は旧様式の印刷節コードをそのまま保持し、認定証跡は未検出のため NULL。
    tables:
      - name: financial
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2020-2023/jurisdiction=132071/year=*/document_kind=settlement/edition=*/direction=expenditure/table=fy*-*-financial/data.parquet', hive_partitioning=false, filename=true, union_by_name=true))"
      - name: controls
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2020-2023/jurisdiction=132071/year=*/document_kind=settlement/edition=*/direction=expenditure/table=fy*-*-controls/data.parquet', hive_partitioning=false, filename=true, union_by_name=true))"
      - name: projects
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2020-2023/jurisdiction=132071/year=*/document_kind=settlement/edition=*/direction=expenditure/table=fy*-*-projects/data.parquet', hive_partitioning=false, filename=true, union_by_name=true))"
      - name: page_inventory
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2020-2023/jurisdiction=132071/year=*/document_kind=settlement/edition=*/direction=observation/table=fy*-page-inventory/data.parquet', hive_partitioning=false, filename=true, union_by_name=true))"
