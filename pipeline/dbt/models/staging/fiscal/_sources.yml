version: 2

sources:
  # 取得の単位（団体コード, 年度, direction）ごとに1ソース。
  # **団体ごとに列が違う**（三鷹市には事項があり多摩市には無い）ので、
  # 団体をまたいで1つのソースにはできない。団体を足すときはこのブロックを足す。
  - name: raw_131016
    description: |
      千代田区。**原典は PDF の事項別明細書**（当初予算。2022〜2024・2026年度の一般・特別会計）。
      ⚠️ ここにあるのは `pipeline/ingestion/fiscal/extract_statement.py` が起こした表で、
      原文のバイト列ではない（`raw_form = "extracted"`）。復元一致の検査は成立しない。
    meta:
      external_location: "(select * exclude(filename), regexp_extract(filename, '/jurisdiction=([^/]+)', 1) as jurisdiction, cast(regexp_extract(filename, '/year=([^/]+)', 1) as integer) as year, regexp_extract(filename, '/document_kind=([^/]+)', 1) as document_kind, regexp_extract(filename, '/edition=([^/]+)', 1) as edition, regexp_extract(filename, '/direction=([^/]+)', 1) as direction, nullif(regexp_extract(filename, '/table=([^/]+)', 1), '') as \"table\" from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=131016/year=*/document_kind=*/edition=*/direction={name}/**/data.parquet', hive_partitioning=false, union_by_name=true, filename=true))"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132047
    description: 三鷹市。予算2016〜2026・決算2014〜2025。文書別の金額列をunion_by_nameで読み、amounts_resolve_for_every_rowで欠損を拒否する。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=132047/year=*/document_kind=*/edition=*/direction={name}/data.parquet', hive_partitioning=true, union_by_name=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132071
    description: |
      昭島市。**原典は PDF の事項別明細書**（当初予算。2020〜2026年度の確認済み一般・特別会計）。
      ⚠️ ここにあるのは `pipeline/ingestion/fiscal/extract_statement.py` が起こした表で、
      原文のバイト列ではない（`raw_form = "extracted"`）。復元一致の検査は成立しない。
      保証の強さは取得物の隣の `provenance.json`（`verification`）に書いてある。
    meta:
      external_location: "(select * exclude(filename), regexp_extract(filename, '/jurisdiction=([^/]+)', 1) as jurisdiction, cast(regexp_extract(filename, '/year=([^/]+)', 1) as integer) as year, regexp_extract(filename, '/document_kind=([^/]+)', 1) as document_kind, regexp_extract(filename, '/edition=([^/]+)', 1) as edition, regexp_extract(filename, '/direction=([^/]+)', 1) as direction, nullif(regexp_extract(filename, '/table=([^/]+)', 1), '') as \"table\" from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=132071/year=*/document_kind=*/edition=*/direction={name}/**/data.parquet', hive_partitioning=false, union_by_name=true, filename=true))"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132195
    description: 狛江市。原典の Parquet を直接読む（決算書。2018〜2023 の6年度）
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=132195/year=*/document_kind=settlement/edition=*/direction={name}/data.parquet', hive_partitioning=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132241
    description: |
      多摩市。原典の Parquet を直接読む（当初予算。2021〜2025 の5年度）。
      ⚠️ **年度で列構成が違うので `union_by_name` が要る。** 令和7年度は金額の列名が
      `予算額` から `合計 / 予算額` へ変わり、歳出からは `年度` の列が消えた。
      無い列は NULL として読まれるので、**列名の書き間違いが黙って NULL になる**経路が
      この団体にだけ開く。塞ぐのは
      `amount_declarations_cover_years`（宣言が原典の全年度を覆っているか）と
      `source_year_column_scope_is_real`（年度の列を外した年度で本当に列が無いか）、
      それに従来からの `canonical_preserves_source`（原典と staging の多重集合一致）。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=132241/year=*/document_kind=*/edition=*/direction={name}/data.parquet', hive_partitioning=true, union_by_name=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132195_project_names
    description: |
      狛江市。決算資料 PDF から起こした事業名。**原典そのものではない。**
      ⚠️ 抽出は不可逆なので、CSV のような復元一致の検査ができない。
      保証の強さは証跡（`verification: hierarchy-totals`）に書いてある。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/project-names/jurisdiction=132195/year=*/data.parquet', hive_partitioning=true)"
    tables:
      - name: data

  - name: raw_132195_revenue_accounts
    description: |
      狛江市。決算資料の歳入事項別明細から起こした歳入の科目名称。**原典そのものではない。**
      ⚠️ 2023 はテキスト抽出、2020〜2022 は OCR（誤読が混ざる前提の経路）。
      調定額が原典 CSV と一致した科目だけを下流が名称に使う。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/revenue-accounts/jurisdiction=132195/year=*/data.parquet', hive_partitioning=true)"
    tables:
      - name: data

  - name: raw_132195_history
    description: 狛江市2023年度当初・補正の目明細と議決日根拠。CSV決算とは別列構造。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/jurisdiction=132195/year=*/document_kind=*/edition=*/direction=expenditure/resource=*/data.parquet', hive_partitioning=true)"
    tables:
      - name: data

  - name: raw_131016_moku_setsu
    description: 千代田区当初予算の左頁の目×節別内訳。説明欄の事業別内訳とは独立した同じ予算の分解で、足し合わせない。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/statement-moku-setsu/jurisdiction=131016/year=*/document_kind=*/edition=*/direction=expenditure/table=*/data.parquet', hive_partitioning=true, union_by_name=true)"
    tables:
      - name: data

  - name: raw_132195_supplementary_detail
    description: 承認済み補正の説明欄に印字された事業×歳出節。予備費は原典粒度の例外として保持し、目合計と二重加算しない。
    meta:
      external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/supplementary-detail/jurisdiction=132195/year=*/document_kind=supplementary/edition=*/direction=expenditure/resource=supplementary-expenditure-project-setsu/data.parquet', hive_partitioning=false)"
    tables:
      - name: data

  - name: raw_132241_settlement_pdf
    description: 多摩市固定決算PDFの独立粒度。法定目×節、細目×財源、非加算の印字統制値及び位置付き原典語。
    tables:
      - name: legal_setsu
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=legal-setsu-*/data.parquet', hive_partitioning=false, union_by_name=true)"
      - name: project_funding
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=project-funding-*/data.parquet', hive_partitioning=false, union_by_name=true)"
      - name: moku_controls
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=moku-controls-*/data.parquet', hive_partitioning=false, union_by_name=true)"
      - name: account_controls
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=account-controls/data.parquet', hive_partitioning=false, union_by_name=true)"
      - name: project_controls
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=project-controls-*/data.parquet', hive_partitioning=false, union_by_name=true)"
      - name: source_words
        meta:
          external_location: "read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/tama-settlement-pdf/jurisdiction=132241/year=*/document_kind=settlement/edition=*/direction=expenditure/table=source-words/data.parquet', hive_partitioning=false, union_by_name=true)"
