sources:
  - name: raw_132071_supplementary_fy2025_01
    description: |
      昭島市 令和7年度一般会計補正予算（第1号）概要のネイティブ有限復元。
      款別集計表の歳入・目的別歳出・性質別歳出の3表。amount_change は補正増減額であり
      phase ではない（phases=[]）。budget_before/budget_after は補正前額・補正後額で個別保持。
      構成比列・印刷合計・節・内容行はこの3表には含めない（別テーブルの非加算観測）。
    tables:
      - name: kan_summary_revenue
        meta:
          external_location: "(select * from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-supplementary2020-2025/jurisdiction=132071/year=2025/document_kind=supplementary/edition=*/direction=revenue/table=kan-summary-revenue/data.parquet', union_by_name=true))"
      - name: kan_summary_expenditure_purpose
        meta:
          external_location: "(select * from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-supplementary2020-2025/jurisdiction=132071/year=2025/document_kind=supplementary/edition=*/direction=expenditure/table=kan-summary-expenditure-purpose/data.parquet', union_by_name=true))"
      - name: kan_summary_expenditure_nature
        meta:
          external_location: "(select * from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-supplementary2020-2025/jurisdiction=132071/year=2025/document_kind=supplementary/edition=*/direction=expenditure/table=kan-summary-expenditure-nature/data.parquet', union_by_name=true))"
