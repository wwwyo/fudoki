version: 2
sources:
  - name: raw_132071_settlement2024
    description: |
      昭島市 令和6年度決算書（全項）のネイティブ有限復元。節列を持つ歳出明細、独立した
      事業備考合計、非加算の印刷統制、651物理頁の棚卸。候補表や診断出力は入力ではない。
      8種の分割公開 PDF は頁観測証跡であり、財務入力として採用しない（二重計上を避ける）。
    tables:
      - name: financial
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2024/jurisdiction=132071/year=2024/document_kind=settlement/edition=*/direction=expenditure/table=fy2024-*-financial/data.parquet', hive_partitioning=false, filename=true))"
      - name: controls
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2024/jurisdiction=132071/year=2024/document_kind=settlement/edition=*/direction=expenditure/table=fy2024-*-controls/data.parquet', hive_partitioning=false, filename=true))"
      - name: projects
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2024/jurisdiction=132071/year=2024/document_kind=settlement/edition=*/direction=expenditure/table=fy2024-*-projects/data.parquet', hive_partitioning=false, filename=true))"
      - name: page_inventory
        meta:
          external_location: "(select * exclude(filename), regexp_extract(filename, '/table=([^/]+)', 1) as _partition_table_id from read_parquet('{{ env_var('FUDOKI_INPUT_DIR') }}/akishima-settlement2024/jurisdiction=132071/year=2024/document_kind=settlement/edition=*/direction=observation/table=fy2024-page-inventory/data.parquet', hive_partitioning=false, filename=true))"
