version: 2

seeds:
  - name: cofog_rules
    meta:
      # **判断そのもの。** これを適用した下流は fudoki の言い分を含む。
      role: judgment-rule
    description: |
      COFOG の割り当て規則。**fudoki の判断そのもの**なのでデータとして持つ。
      priority の小さい順に見て最初に当たったものを採る（具体的な規則ほど先）。
      applies_to が空の規則は法定語彙（款・節）にだけ当たるので、どの団体にも効く。
      ⚠️ **名称で当たらない団体がある。** 狛江市は款・項・目に名称の列が原典に無いので、
      名称を条件にした規則は1本も当たらない。名称を捏造せず `match_kan_code` で当て、
      何の款かとその出所を basis に書く。
    config:
      # 団体コードは数値ではなく識別子。推論に任せると先頭ゼロが落ち、
      # match_* も値によって型が揺れる。
      column_types:
        priority: integer
        rule_id: varchar
        applies_to: varchar
        match_fund: varchar
        match_kan: varchar
        match_kou: varchar
        match_kan_code: varchar
        match_moku: varchar
        moku_mode: varchar
        match_setsu: varchar
        status: varchar
        division: varchar
        consolidation: varchar
        decided_at_level: varchar
        counterpart_fund: varchar
        basis: varchar
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: priority
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [assigned, unclassifiable, out-of-scope]
      - name: consolidation
        data_tests:
          - accepted_values:
              values: [retained, eliminated]

  - name: account_master
    meta:
      role: legal-reference
    description: |
      法定の科目マスタ。地方自治法施行規則 別記「歳入歳出予算の款項の区分及び目の区分」
      （第15条関係）の市町村の表（歳入・歳出）を原文の PDF から起こしたもの
      （`pipeline/ingestion/fiscal/fetch_account_master.py` が生成。手で編集しない）。
      **なぜ要るか: 款のコードは団体ごとにずれている。** 法定の款11は災害復旧費だが、
      それを持たない三鷹市・狛江市はどちらも 11 が公債費で、以降が詰まっている。
      コードでは団体をまたいで比較できないので、このマスタと対応表（account_map）を介す。
      ⚠️ 適用範囲は**一般会計だけ**（様式の備考6: 特別会計は長が定めた区分による）。
      is_personnel_moku は様式の※印（一般職の給料・職員手当等・共済費を計上する目。備考2）。
    config:
      column_types:
        direction: varchar
        kan_code: integer
        kan_name: varchar
        kou_code: integer
        kou_name: varchar
        moku_code: integer
        moku_name: varchar
        is_personnel_moku: boolean
        basis: varchar

  - name: account_map
    meta:
      role: judgment-rule
    description: |
      団体の科目コード・名称と法定マスタ（account_master）の対応。**fudoki の判断。**
      kind=map はマスタの区分と同じだと決めたもの、kind=addition は法定に無い
      団体固有の追加区分（施行規則の備考1が行政権能の差による追加を認めている）、
      kind=historical は現行様式から削除された旧法定区分（例: 自動車取得税交付金）。
      款の対応行は kou_name・kou_code が空。項の行は自動対応（名称の完全一致）で決まらない
      ものだけ持つ — 項名がある団体は kou_name に帳簿の項名を、無い団体は kou_code に
      項コードを書く（項コードの対応は項名が取れない会計にだけ使う）。
      ⚠️ **ここに無い款が一般会計の歳出に現れたらパイプラインが止まる**
      （tests/account_map_covers_lines.sql）。黙って未対応のまま配らないため。
    config:
      # ⚠️ dbt-duckdb の seed の COPY 経路（fast）は、この CSV で方言の自動判定に失敗する
      # （full-refresh でも再現。空の多い列と長い日本語セルの組合せ）。INSERT 経路なら通る。83行なので性能差は無い
      fast: false
      column_types:
        jurisdiction_code: varchar
        direction: varchar
        # ⚠️ **原典の表記そのまま。** 正規化しない — 正本（expenditure.csv）の kan_code が
        # 原典の表記なので、揃えると利用者が join できなくなる。
        # 表記が年度で割れる団体（多摩市はゼロ埋めが R3 の `01` から R4 の `1` へ変わる）は、
        # 同じ款に両表記の行を持つ。**行が2つあること自体が原典の表記の記録**である。
        kan_code: varchar
        kou_name: varchar
        # 項名が取れない団体（狛江市などコードのみ）が項の対応を書くための項コード列。
        # kou_name が空の項行でだけ使う
        kou_code: varchar
        # ⚠️ **空は一般会計だけに効く。** 特別会計への対応は canonical_fund を書く。
        # 「全会計に効く」ではない — 一般会計の款対応が特別会計の同名款に
        # 誤って写るのを防ぐための区別。
        fund: varchar
        # 対応が効き始める年度（空 = 全年度）。⚠️ 款コードの意味が年度で変わる団体がある —
        # 狛江市の歳入は 2019/2020 の境界で款の新設により以降のコードが繰り下がった。
        # 特別会計は会計の科目体系自体が年度で変わる（狛江市の国保は 2018/2019 で款構成が違う）。
        # ⚠️ integer にすると dbt-duckdb の seed が CSV の方言判定に失敗する（実測）。varchar で持ち core で cast する
        fiscal_year_from: varchar
        fiscal_year_to: varchar
        kind: varchar
        master_kan_code: integer
        master_kou_code: integer
        basis: varchar

  - name: fund_directory
    meta:
      # **判断そのもの。** 名寄せと枠組みの割り振りは自治体が言っていないこと。
      role: judgment-rule
    description: |
      収録した会計の名寄せ辞書。fund_label（原典の会計名）を、制度として同じものを
      指す canonical_fund へ対応づける。同じ制度の会計の呼び名は団体で違う
      （「国民健康保険事業特別会計」「国民健康保険特別会計」）ので、
      団体をまたぐ比較は canonical_fund で行う。
      account_class は帳簿上の区分（一般会計 / 特別会計 / 公営企業会計）。
      sector は地方財政状況調査の枠組み（futsu-kaikei = 普通会計の範囲、
      koei-jigyo-kaikei = 公営事業会計相当）。**同じ制度が団体で違う会計形態
      を取りうる**（狛江市の下水道は特別会計→公営企業会計へ移行）のが前提。
    config:
      fast: false
      column_types:
        jurisdiction_code: varchar
        fund_label: varchar
        canonical_fund: varchar
        account_class: varchar
        sector: varchar
        basis: varchar

  - name: special_account_master
    meta:
      # **canonical な比較軸そのものは fudoki が定義している。** 調査票の
      # 勘定科目を写した行と、帳簿の共通構造から起こした行が混在するので
      # 行ごとの出所は basis が言う（「64表 歳出018列」「帳簿に共通する項」など）
      role: judgment-rule
    description: |
      特別会計の款・項の canonical な語彙。調査票の勘定科目から起こした行が
      主で、調査票が無い会計・階層は帳簿の共通構造から fudoki が定義する。
      - 国民健康保険: 52表（事業勘定）
      - 介護保険: 63表（保険事業勘定）
      - 介護サービス事業: 64表（介護サービス事業勘定）
      - 後期高齢者医療: 94表（市町村）
      - 駐車場・下水道などの収益事業型: 調査票に専用表が無いため、
        50表・64表に共通する収益事業勘定の構造を比較軸として定義
      kou_code が空の行は款の定義、値がある行はその款の下の項の定義。
      一般会計のマスタ（account_master）とは**別物**で、特別会計の科目を
      一般会計の区分に写さない（同名款は同じ科目を意味しない）。
    config:
      column_types:
        canonical_fund: varchar
        direction: varchar
        kan_code: integer
        kan_name: varchar
        kou_code: integer
        kou_name: varchar
        basis: varchar

  - name: interfund_transfers
    meta:
      role: judgment-rule
    description: |
      連結消去する会計間移転の宣言。**受け皿・出し手の会計が分かるものだけ**書く。
      書けない繰出入（相手が確定できない・対の金額が両側で一致しない）は
      retained のまま残る — 捏造しない。キーは (団体, 年度, 方向, 会計, 款, 項)
      に必要なだけ 目・節・額 を足す（`*` はワイルドカード。空欄にすると Table Schema の主キーが null を含んで違反になるので、ワイルドカードは明示の記号にする）。
      amount_yen は同じ科目に複数の受け皿があるとき、額で行を確定するためのもの。
      fund_label と counterpart_fund は**原典の会計名**（fund_label の語彙）で書く。
      canonical_fund（名寄せ後の制度名）では当たらない — 名寄せは下流でやる。
      宣言が実際の行に当たるかは tests/interfund_declarations_resolve.sql、
      両側の合計が釣り合うかは tests/consolidation_pairs_balance.sql、
      相手方が収録済みの会計かは tests/consolidation_counterpart_is_recorded.sql が見る。
    config:
      # 空の多い列と長い日本語セルの組合せ（account_map と同じ失敗パターン）
      fast: false
      column_types:
        jurisdiction_code: varchar
        fiscal_year: varchar
        direction: varchar
        fund_label: varchar
        kan_code: varchar
        kou_code: varchar
        moku_code: varchar
        setsu_code: varchar
        amount_yen: varchar
        counterpart_fund: varchar
        basis: varchar

  - name: soumu_expected_diffs
    meta:
      # **判断そのもの。** 差分の分類は fudoki の解釈。
      role: judgment-rule
    description: |
      総務省統計との突合で出る差分の分類宣言。款ごとの差がどういう違いかを
      klass で書く（survey-reclass = 調査票記入時の目的別振替、unresolved =
      要因が確定していない大きな差分、phase = 段階の違い、parse-bug =
      取り込み側の誤り）。ここに無い差分が出ると
      tests/soumu_reconciliation_explained.sql が unexplained として止める。
    config:
      fast: false
      column_types:
        jurisdiction_code: varchar
        fiscal_year: varchar
        scope: varchar
        direction: varchar
        kan_label: varchar
        klass: varchar
        note: varchar
