<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      正式名称の「風土記」を先に出す（"fudoki" は機械可読の識別子として
      alternateName / og:site_name に残す）。
    -->
    <title>風土記（fudoki）— 自治体の予算を事業単位まで開く</title>
    <meta
      name="description"
      content="日本の地方自治体の支出を事業単位（目）まで構造化し、COFOG を割り当てて外部データと join 可能な形で配布する。Fiscal Data Package 1.0.0 準拠。原典・配布物・検証結果をリポジトリに置く。"
    />
    <link rel="canonical" href="https://fudoki.dev/" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fudoki" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="風土記（fudoki）— 自治体の予算を事業単位まで開く" />
    <meta
      property="og:description"
      content="自治体の支出を事業単位（目）まで構造化し、COFOG を割り当てて配布する。Fiscal Data Package 1.0.0 準拠。"
    />
    <meta property="og:url" content="https://fudoki.dev/" />
    <meta property="og:image" content="https://fudoki.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="風土記 — 自治体の予算を事業単位まで開く" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />

    <!--
      Google Dataset Search はこの JSON-LD を読む。データを配る PJ なので、
      普通の検索より効く入口にあたる。
      ⚠️ **収録範囲（団体・年度）はここに書かない。** pipeline.json が持つ事実を
      手で写すと、対象を広げた瞬間に嘘になる。収録状況はホーム画面が pipeline.json を
      実行時に読んで出す（`src/pages/home.tsx`）。
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "風土記（fudoki）",
        "alternateName": "fudoki",
        "description": "日本の地方自治体の支出を事業単位（目）まで構造化し、COFOG を割り当てて外部データと join 可能な形で配布するデータセット。Fiscal Data Package 1.0.0 に沿う。原典・配布物・検証結果をリポジトリに置く。",
        "url": "https://fudoki.dev/",
        "sameAs": "https://github.com/wwwyo/fudoki",
        "codeRepository": "https://github.com/wwwyo/fudoki",
        "license": "https://creativecommons.org/licenses/by/4.0/",
        "isAccessibleForFree": true,
        "inLanguage": "ja",
        "keywords": [
          "地方自治体",
          "予算",
          "歳出",
          "オープンデータ",
          "COFOG",
          "Fiscal Data Package",
          "地方財政",
          "municipal budget",
          "Japan"
        ],
        "distribution": [
          {
            "@type": "DataDownload",
            "encodingFormat": "text/csv",
            "contentUrl": "https://raw.githubusercontent.com/wwwyo/fudoki/main/data/budget/datapackages/132047/expenditure.csv"
          },
          {
            "@type": "DataDownload",
            "encodingFormat": "text/csv",
            "contentUrl": "https://raw.githubusercontent.com/wwwyo/fudoki/main/data/budget/datapackages/132047/revenue.csv"
          },
          {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://raw.githubusercontent.com/wwwyo/fudoki/main/data/budget/datapackages/132047/datapackage.json"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
