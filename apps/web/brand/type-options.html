<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風土記 — 文字と下線の丸み</title><style>
/* Hallmark · pre-emit critique: P4 H4 E5 S5 R5 V4 · genre: modern-minimal · design-system: DESIGN.md · 書体の比較 */
:root{--background:#fff;--foreground:#292d32;--muted:#666b72;--border:#dce0e4;--surface:#f7f8f9;--focus:#243b53;--night:#0a0a0a;--night-foreground:#fafafa;--font:"Hiragino Sans","Noto Sans JP",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{font:14px/1.7 var(--font);background:var(--background);color:var(--foreground)}main{max-width:1440px;margin:auto;padding:28px 24px}h1{font-size:24px;margin:0 0 8px;min-width:0;overflow-wrap:anywhere}h2{font-size:18px;margin:0;min-width:0;overflow-wrap:anywhere}p{margin:0;color:var(--muted)}button{font:inherit;min-height:44px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--foreground);padding:8px 14px;cursor:pointer;white-space:nowrap}button[aria-selected=true],button[aria-pressed=true]{color:var(--background);background:var(--foreground);border-color:var(--foreground)}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}@media(hover:hover){button:hover{background:var(--surface)}button[aria-selected=true]:hover,button[aria-pressed=true]:hover{background:var(--focus)}}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0}.tabs{display:flex;gap:8px}.toolbar label{display:flex;align-items:center;gap:8px;min-height:44px}.toolbar input{accent-color:var(--focus)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:24px}.rules{grid-template-columns:repeat(3,minmax(0,1fr))}section{min-width:0}.name{font-size:12px;color:var(--muted)}.description{font-size:13px;min-height:48px;margin-top:8px}.sample{padding:24px 0;min-height:132px;display:flex;align-items:center}.sample img{height:72px;max-width:100%}.small{display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-height:64px}.small img{height:40px;max-width:100%}.small span{font-size:12px;color:var(--muted)}.word{margin:20px 0;min-height:56px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.word img{height:40px;max-width:100%}.word span{font-size:12px;color:var(--muted)}.samples{padding:0 12px;margin-top:16px}.samples.dark{background:var(--night);color:var(--night-foreground)}.samples.dark span{color:var(--night-foreground)}.caption{font-size:12px;color:var(--muted);margin:8px 0 16px}figure{margin:24px 0 0}.context{width:100%;height:auto;display:block;border:1px solid var(--border)}figcaption{font-size:12px;color:var(--muted);margin-top:8px}.control{margin-top:16px}details{margin-top:28px}summary{cursor:pointer;min-height:44px;line-height:44px}iframe{display:block;width:100%;height:550px;border:1px solid var(--border)}#liveStatus{font-size:12px;margin:8px 0}a{color:var(--foreground)}.sources{display:flex;flex-wrap:wrap;gap:16px}.sources a{white-space:nowrap}[hidden]{display:none!important}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rules{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:740px){main{padding:20px 16px}h1{font-size:22px}.grid{grid-template-columns:minmax(0,1fr);gap:36px}.description{min-height:0}.samples{padding:0 8px}.sample{min-height:120px}.sample img{height:64px}}
</style></head><body><main><h1>風土記 — 文字と下線の丸み</h1><p>文字は字面の高さ・字間・位置を揃えて比較。マークは「短め」、間隔8px、色は共通です。</p><div class="toolbar"><div class="tabs" role="tablist" aria-label="比較する項目"><button id="fontTab" role="tab" aria-controls="fontPanel" aria-selected="true">文字</button><button id="ruleTab" role="tab" aria-controls="rulePanel" aria-selected="false" tabindex="-1">下線</button></div><label><input id="dark" type="checkbox">ダーク背景</label></div>
<div id="fontPanel" role="tabpanel" aria-labelledby="fontTab"><p>下線の角丸は0.6で共通。現在の書体はAです。</p><div class="grid" id="fonts"></div></div>
<div id="rulePanel" role="tabpanel" aria-labelledby="ruleTab" hidden><p id="ruleNote"></p><div class="grid rules" id="rules"></div></div>
<details id="live"><summary id="liveTitle">実画面で確認</summary><p id="liveStatus" role="status" aria-live="polite"></p><iframe id="product" title="選んだロゴを検証画面へ適用" hidden></iframe></details>
<details><summary>書体の出典</summary><div class="sources" id="sources"></div></details>
</main><script>
const DATA=__DATA__;
const DESCRIPTIONS=["現在の書体。払いの曲線と太めの線が特徴です。","直線が明快で、字の内側が広い。軽めの印象です。","線の太さが揃い、より角張った幾何的な印象です。","角を締めつつ、和文らしい払いを残す案です。"];
const $=id=>document.getElementById(id);let selected="a",radius=.6,mode="font",ready=false;
const asset=(id,kind,r=.6,dark=$("dark").checked)=>DATA.find(v=>v.id===id).assets[kind+(kind==="wordmark"?"":"-r"+r)+(dark?"-dark":"")];
for(const [i,v]of DATA.entries()){const s=document.createElement("section");s.innerHTML=`<h2>${v.id.toUpperCase()} · ${v.font}</h2><p class="description">${DESCRIPTIONS[i]}</p><div class="samples" data-samples><div class="sample"><img data-font="${v.id}" data-kind="logo" alt="${v.font}の横組み・拡大"></div><div class="small"><img data-font="${v.id}" data-kind="logo" alt="${v.font}の横組み・実サイズ"><span>高さ40px</span></div><div class="word"><img data-font="${v.id}" data-kind="wordmark" alt="${v.font}の文字単体"><span>文字だけ</span></div></div><button type="button" class="control" data-pick-font="${v.id}" aria-pressed="${v.id===selected}">${v.id.toUpperCase()}を実画面へ</button><figure><img class="context" data-product="${v.id}" alt="${v.font}を使った実画面の抜粋"><figcaption>実画面 · ロゴ40px · 下線0.6</figcaption></figure>`;$("fonts").append(s);s.querySelector("button").addEventListener("click",()=>{selected=v.id;radius=.6;render();openLive()});const a=document.createElement("a");a.href=v.source.source;a.textContent=v.font;$("sources").append(a)}
for(const [r,label]of [[.25,"控えめ"],[.6,"少し丸い"],[1,"丸い"]]){const s=document.createElement("section");s.innerHTML=`<h2>${label} · ${r}</h2><div class="samples" data-samples><div class="sample"><img data-radius="${r}" alt="下線の角丸${r}の横組み・拡大"></div><div class="small"><img data-radius="${r}" alt="下線の角丸${r}の横組み・実サイズ"><span>高さ40px</span></div></div><button class="control" type="button" data-pick-radius="${r}" aria-pressed="${r===radius}">${r}を実画面へ</button>`;$("rules").append(s);s.querySelector("button").addEventListener("click",()=>{radius=r;render();openLive()})}
function render(){const dark=$("dark").checked;for(const i of document.querySelectorAll("img[data-font]"))i.src=asset(i.dataset.font,i.dataset.kind);for(const i of document.querySelectorAll("img[data-radius]"))i.src=asset(selected,"logo",Number(i.dataset.radius));for(const i of document.querySelectorAll("img[data-product]")){const src=DATA.find(v=>v.id===i.dataset.product).products[dark?"dark":"light"];i.closest("figure").hidden=!src;if(src)i.src=src}for(const p of document.querySelectorAll("[data-samples]"))p.classList.toggle("dark",dark);for(const b of document.querySelectorAll("[data-pick-font]"))b.setAttribute("aria-pressed",String(b.dataset.pickFont===selected));for(const b of document.querySelectorAll("[data-pick-radius]"))b.setAttribute("aria-pressed",String(Number(b.dataset.pickRadius)===radius));const font=DATA.find(v=>v.id===selected);$("ruleNote").textContent="文字："+font.font+"。文字タブで選んだ案と組み合わせます。";$("liveTitle").textContent="実画面で確認 · "+selected.toUpperCase()+" / 下線 "+radius;updateProduct()}
function tab(next){mode=next;for(const m of ["font","rule"]){$(m+"Panel").hidden=m!==mode;$(m+"Tab").setAttribute("aria-selected",String(m===mode));$(m+"Tab").tabIndex=m===mode?0:-1}}
for(const m of ["font","rule"]){$(m+"Tab").addEventListener("click",()=>tab(m));$(m+"Tab").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();tab(mode==="font"?"rule":"font");$(mode+"Tab").focus()}})}
$("dark").addEventListener("change",render);
function openLive(){$("live").open=true;loadProduct()}
function loadProduct(){if($("product").getAttribute("src"))return;if(!location.protocol.startsWith("http")){$("liveStatus").textContent="実画面はローカル開発サーバーから確認できます。";return}$("liveStatus").textContent="実画面を読み込んでいます…";$("product").hidden=false;$("product").src=location.origin+"/pipeline/"}
$("live").addEventListener("toggle",()=>{if($("live").open)loadProduct()});
function updateProduct(){if(!ready)return;const d=$("product").contentDocument;d.documentElement.classList.toggle("dark",$("dark").checked);d.documentElement.style.setProperty("--primary",DATA[0].accent);for(const i of d.images){const n=i.dataset.logoTypeAsset||(i.getAttribute("src")||"").split("/").pop();if(!/^(logo|mark)(-dark)?\.svg$/.test(n))continue;i.dataset.logoTypeAsset=n;i.src=asset(selected,n.startsWith("mark")?"mark":"logo",radius,n.includes("-dark"))}$("liveStatus").textContent="適用中："+selected.toUpperCase()+" / 下線 "+radius+"。強調色は元のオレンジです。"}
$("product").addEventListener("load",()=>{const d=$("product").contentDocument;function connect(){const i=Array.from(d.images).find(i=>(i.getAttribute("src")||"").endsWith("/logo.svg"));if(!i)return false;ready=true;updateProduct();const r=i.getBoundingClientRect();d.defaultView.scrollTo(0,d.defaultView.scrollY+r.top-(d.defaultView.innerHeight-r.height)/2);return true}if(connect())return;const observer=new MutationObserver(()=>{if(connect())observer.disconnect()});observer.observe(d.documentElement,{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();if(!ready)$("liveStatus").textContent="実画面を読み込めませんでした。"},8000)});
render();window.logoTypePreview={getState:()=>({selected,radius,dark:$("dark").checked,ready}),asset};
</script></body></html>
