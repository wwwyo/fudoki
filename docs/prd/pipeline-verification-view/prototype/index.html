<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipeline-view prototype（上下分割） | fudoki</title>
<style>
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --primary: oklch(43.7% 0.067 157);
  --primary-foreground: oklch(96.4% 0.011 95);
  --accent: oklch(96.5% 0.012 157);
  --accent-foreground: oklch(32% 0.04 157);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--background); color: var(--foreground);
  font-family: "Geist Variable", "Noto Sans JP Variable", "Hiragino Sans", sans-serif;
  font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased;
}
h1 { font-size: 20px; font-weight: 600; line-height: 28px; margin: 0; }
.mut { color: var(--muted-foreground); }
.small { font-size: 12px; line-height: 19.5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 16px; border: 1px solid var(--border); background: var(--card); white-space: nowrap; }
.badge.ok { color: var(--accent-foreground); border-color: color-mix(in oklch, var(--primary) 25%, var(--border)); background: var(--accent); }
.badge.plain { color: var(--muted-foreground); }
.badge.bad { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 40%, var(--border)); }
.card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
button.linky { border:0; background:none; font:inherit; cursor:pointer; color:var(--primary); padding:0; text-align:left; }
select.ctl { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); }

/* 図 */
.graphsvg .edge { stroke: var(--muted-foreground); stroke-width: 1.4; fill: none; opacity: .55; }
.graphsvg .edge-hit { stroke: transparent; stroke-width: 24; fill: none; cursor: pointer; }
.graphsvg .edge-sel-under { stroke: var(--primary); stroke-width: 10; fill: none; opacity: .18; }
.graphsvg .edge-sel { stroke: var(--primary); stroke-width: 2.6; fill: none; opacity: 1; }
.gnode rect.body { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
.gnode:hover rect.body { stroke: var(--primary); }
.gnode.sel rect.ring { fill: none; stroke: var(--primary); stroke-width: 3; }
.gnode .io-tag { font-size: 9px; font-weight: 600; fill: var(--primary-foreground); }
.gnode .io-tag-bg { fill: var(--primary); }
.graphsvg text { font-family: inherit; }
.dim { opacity: .18; }

/* I/O パネル */
/* 選んだ組を並べる。2件目以降は罫線で区切る */
.io-pair + .io-pair { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
.pair-x { border: 0; background: none; font: inherit; font-size: 12px; line-height: 1; color: var(--muted-foreground); cursor: pointer; margin-left: auto; padding: 2px 4px; border-radius: 4px; }
.pair-x:hover { color: var(--foreground); background: var(--accent); }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.io .side h3 { font-size: 12px; font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.io-node + .io-node { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.rows { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 100%; }
table.t { border-collapse: collapse; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; width: 100%; }
table.t th { position: sticky; top: 0; background: var(--muted); text-align: left; font-weight: 500; color: var(--muted-foreground); padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 3px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
table.t tr.rowhit { cursor: pointer; }
table.t tr.rowhit:hover td { background: var(--accent); }
table.t tr.rowsel td { background: var(--accent); outline: 2px solid var(--primary); outline-offset: -2px; }
/* 行の選択はセルごとの枠ではなく行全体に一続きの枠で示す。border-collapse でも
   box-shadow(inset) は隣接セルと隙間なく連なるので、上下線は全 td、左右の端は
   先頭/末尾の td に引く。反対側に点灯する対応行も同じ rowsel で同じ見た目になる */
.v1 table.t tr.rowhit:hover td { box-shadow: inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 table.t tr.rowhit:hover td:first-child { box-shadow: inset 1.5px 0 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 table.t tr.rowhit:hover td:last-child { box-shadow: inset -1.5px 0 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 table.t tr.rowsel td, .v1 table.t tr.rowsel:hover td { outline: 0; box-shadow: inset 0 2px 0 var(--primary), inset 0 -2px 0 var(--primary); }
.v1 table.t tr.rowsel td:first-child, .v1 table.t tr.rowsel:hover td:first-child { box-shadow: inset 2px 0 0 var(--primary), inset 0 2px 0 var(--primary), inset 0 -2px 0 var(--primary); }
.v1 table.t tr.rowsel td:last-child, .v1 table.t tr.rowsel:hover td:last-child { box-shadow: inset -2px 0 0 var(--primary), inset 0 2px 0 var(--primary), inset 0 -2px 0 var(--primary); }
details.fold { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
details.fold > summary { cursor: pointer; font-size: 12px; color: var(--muted-foreground); }
/* 「注意点」トグルは I/O ペイン先頭で罫線の fold ではなく警告色の帯として出す */
.iowrap > details.fold { border-top: 0; margin-top: 0; padding-top: 0; }
.iowrap > details.caveats { border: 1px solid color-mix(in oklch, oklch(0.72 0.12 85) 50%, var(--border)); border-radius: 8px; background: color-mix(in oklch, oklch(0.94 0.05 95) 65%, var(--card)); padding: 0 12px; margin-bottom: 14px; margin-top: 18px; }
details.caveats > summary { color: oklch(0.52 0.12 75); font-weight: 600; padding: 7px 0; }
details.caveats .cv:last-child { padding-bottom: 8px; }
/* 詳細トグルの中身。項目名を狭い左列に、値を右に並べる。URL は折り返す */
.v1 details.fold .dh { font-size: 11px; font-weight: 600; color: var(--muted-foreground); margin: 8px 0 2px; }
.v1 details.fold .dh:first-of-type { margin-top: 4px; }
.v1 details.fold .drow { display: flex; gap: 8px; font-size: 12px; line-height: 18px; padding: 1.5px 0; }
.v1 details.fold .drow > :last-child { min-width: 0; }
.v1 details.fold .dk { flex: 0 0 64px; color: var(--muted-foreground); }
.v1 details.fold a { color: var(--primary); word-break: break-all; }

/* PDF */
.pdfpage { position: relative; margin-bottom: 12px; }
.pdfpage img { display: block; width: 100%; height: auto; }
.pdfpage .wspan { position: absolute; color: transparent; cursor: text; user-select: text; -webkit-user-select: text; overflow: hidden; line-height: 1; }
.pdfpage .wspan::selection { background: rgba(47,93,67,.25); color: transparent; }
.pdfpage .hit { position: absolute; border-radius: 3px; background: rgba(47,93,67,.14); outline: 1.5px solid var(--primary); pointer-events: none; }
/* ページ送りはビューア上部のツールバーとして .pdfview の枠に収める（画像とひとまとまり）。
   sticky で残すのは変えない（長い頁をスクロールしても送り口が見える） */
.v1 .pdfview { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); }
.v1 .pdfpager { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--muted); border-bottom: 1px solid var(--border); border-radius: calc(var(--radius-sm) - 1px) calc(var(--radius-sm) - 1px) 0 0; }
.v1 .pdfview .pdfpage { margin-bottom: 0; border-radius: 0 0 calc(var(--radius-sm) - 1px) calc(var(--radius-sm) - 1px); overflow: hidden; }
.v1 .pgbtn { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm); font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; line-height: 16px; }
.v1 .pgbtn:hover:not([disabled]) { background: var(--accent); border-color: var(--primary); }
.v1 .pgbtn[disabled] { opacity: .4; cursor: default; }
/* 押すと行が選べる単語だけ指カーソル。他の単語は text カーソルのまま（文字選択が生きている印） */
.v1 .pdfpage .wspan[data-sr] { cursor: pointer; }
.v1 .pdfpage .wspan[data-sr]:hover, .v1 .pdfpage .wspan.srhov { background: rgba(47,93,67,.22); border-radius: 2px; }
/* hover の予告（未選択の対応づけ）: 表の行・PDF の番号フラッグを同じ系統で薄く点灯させる */
.v1 tr.rowhov td { box-shadow: inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 tr.rowhov td:first-child { box-shadow: inset 2px 0 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 tr.rowhov td:last-child { box-shadow: inset -2px 0 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent), inset 0 -1.5px 0 color-mix(in oklch, var(--primary) 45%, transparent); }
.v1 .pdfpage .srflag.flaghov { opacity: 1; }
/* source_row の番号バッジ。表では source_row セルの値を、PDF では対応 hit の脇に
   同じ見た目で出す。薄い = 対応がある行、塗り = 選択中（対応が無い行には出さない） */
.srnum, .v1 .pdfpage .srflag { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 16px; padding: 0 5px; border-radius: 5px; border: 1px solid color-mix(in oklch, var(--primary) 40%, var(--border)); background: var(--accent); color: var(--accent-foreground); font-size: 10px; font-weight: 600; line-height: 1; }
.v1 tr.rowsel .srnum, .v1 .pdfpage .srflag.sel { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.v1 .pdfpage .srflag { position: absolute; transform: translate(calc(-100% - 4px), -50%); opacity: .45; pointer-events: none; z-index: 1; }
.v1 .pdfpage .srflag.sel { opacity: 1; box-shadow: 0 1px 4px rgba(0,0,0,.25); }

/* harness bar */
.harness-bar { position: fixed; top: 12px; left: 12px; z-index: 2147483646; display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: rgba(10,10,10,.82); backdrop-filter: blur(12px); font-size: 12px; }
.harness-bar button { border: 0; border-radius: 6px; padding: 4px 10px; background: transparent; color: rgba(255,255,255,.55); font: inherit; cursor: pointer; }
.harness-bar button[data-active] { background: rgba(255,255,255,.14); color: #fff; }

/* 見出し */
.headline { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
details.fold .cv { padding: 6px 0; border-top: 1px solid var(--border); }
details.fold .cv:first-of-type { border-top: 0; }
details.fold .cv .t { font-weight: 500; }
details.fold .cv .b { font-size: 12px; color: var(--muted-foreground); }
details.fold .cv .b p { margin: 0 0 6px; }
details.fold .cv .b ul { margin: 4px 0 8px; padding-left: 18px; list-style: disc; }
details.fold .cv .b li { margin: 2px 0; }
details.fold .cv .b > :last-child { margin-bottom: 0; }
details.fold .cv .b code { font-size: 11px; background: color-mix(in oklch, var(--foreground) 7%, transparent); padding: 0 3px; border-radius: 3px; }

/* ===== 上下レイアウト 3 サブ案。軸は「図と I/O が縦の空間をどう分けるか」 ===== */
/* 図ペイン: ズーム/パン・組 hover 機構 */
.v1 .graphwrap { overflow: hidden; position: relative; touch-action: none; user-select: none; }
.v1 .graphsvg { display: block; cursor: grab; }
.v1 .graphsvg.panning, .v1 .graphsvg.panning * { cursor: grabbing !important; }
.zoomctl { position: absolute; right: 10px; bottom: 10px; z-index: 5; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button { min-width: 28px; height: 26px; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground); font: inherit; font-size: 11px; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.zoomctl button:hover { background: var(--accent); border-color: var(--primary); }
.v1 .iowrap { min-height: 0; padding: 12px 16px 110px; }
/* hover はノード単体ではなく組（入力＋線＋出力）の予告。選択済み（実線＋濃い輪）と区別するため破線＋薄い輪にする */
.v1 .gnode:hover rect.body { stroke: var(--border); }
.v1 .edge-hov-under, .v1 .edge-hov, .v1 .gnode rect.hring { pointer-events: none; }
.v1 .edge-hov-under { stroke: var(--primary); stroke-width: 10; fill: none; opacity: 0; }
.v1 .edge-hov { stroke: var(--primary); stroke-width: 2.2; fill: none; opacity: 0; stroke-dasharray: 6 4; }
.v1 g.hov .edge-hov-under { opacity: .10; }
.v1 g.hov .edge-hov { opacity: .6; }
.v1 .gnode rect.hring { fill: none; stroke: var(--primary); stroke-width: 2; opacity: 0; }
.v1 .gnode.hov rect.hring { opacity: .5; }
.v1 .gnode.hov rect.body { stroke: var(--primary); }
/* 1fr 指定だと最小幅が内容で押し広げられて入力側が潰れるので、minmax(0,…) で 1:1 に固定し中身は側内スクロールに逃がす */
.v1 .io { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.v1 .io .side { min-width: 0; }

/* 固定分割: 画面を上下2ペインに割り、各ペインが独立にスクロールする
   （図ペインではパンがスクロール相当）。ページ自体はスクロールせず、境目をドラッグで比率変更 */
.vsplit { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.vsplit .graphwrap { flex: 0 0 auto; }
.splitsash { flex: 0 0 11px; cursor: row-resize; position: relative; z-index: 6; background: var(--muted); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.splitsash::after { content: ""; position: absolute; left: 50%; top: 50%; width: 56px; height: 4px; transform: translate(-50%, -50%); border-radius: 2px; background: color-mix(in oklch, var(--muted-foreground) 45%, transparent); }
.splitsash:hover::after, .splitsash.drag::after { background: var(--primary); }
.vsplit .iowrap { flex: 1; overflow: auto; }
</style>
</head>
<body>
<div class="harness-bar" role="group" aria-label="団体">
  <button data-j="131016">131016 千代田区（PDF）</button>
  <button data-j="132195">132195 狛江市（CSV）</button>
</div>
<div id="stage"></div>
<!-- 生成ファイルを index.html から指しているため、内容が変わるたびにブラウザの
     heuristic cache に引っかかる。data.js を差し替えたら ?v= を上げる -->
<script src="data.js?v=2"></script>
<script>
'use strict';
const DATA = window.PIPELINE_DATA;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('ja-JP');
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*|`([^`]+)`/g, (_, b, c) => b != null ? `<strong>${b}</strong>` : `<code>${c}</code>`);
/* 注意点の本文書式（report/budget/schema.ts 参照）: 空行で段落、`- ` 始まりの段落は箇条書き */
const mdBody = (s) => String(s ?? '').split(/\n{2,}/).map((block) =>
  block.startsWith('- ')
    ? `<ul>${block.split('\n').map((l) => `<li>${md(l.slice(2))}</li>`).join('')}</ul>`
    : `<p>${md(block)}</p>`).join('');
const qs = new URLSearchParams(location.search);
const S = {
  code: qs.get('j') === '132195' ? '132195' : '131016',
  // 年度は収録年度から選ぶ（全年度ビューは持たない — 複数年度を1画面に混ぜると
  // 「この行はどの年度か」を行ごとに判別する必要が出る）。未指定・範囲外は最新年度に倒す
  year: (() => {
    const ys = DATA[qs.get('j') === '132195' ? '132195' : '131016'].meta.fiscalYears;
    const v = Number(qs.get('y'));
    return ys.includes(v) ? v : ys[ys.length - 1];
  })(),
  edges: [],            // [{from,to}] 選択中の組。ノード側面クリックではその側の辺が全部入るので複数
  ctx: {},              // "from|to"（組）・"st:<node>"（星パネル）・"ov:<node>"（overview）の { row, pdfPage }
};
/* 組・overview ノードごとの行選択・PDF 表示頁。組を替えても残らず、並べても混ざらない */
const ctxOf = (k) => (S.ctx[k] ||= { row: null, pdfPage: null });
let V1GEO = null; // 組 hover 判定用ジオメトリ（組矩形・辺のサンプル点）。案関数が mount のたびに作り直す
let V1HOV = null; // hover 中の組キー "from|to"
let V1Z = null;    // 図のズーム/パン {k,tx,ty,fit}。null = 次の mount で fit に初期化
let V1DRAG = null; // パン試行中 {id,x0,y0,tx0,ty0,active}。active は移動 6px 超で立つ
let V1PINCH = null; // 2本指ピンチ中 {d0,mx0,my0,k0,tx0,ty0}（mx0,my0 は svg 座標に換算済み）
let V1NOCLICK = false; // ドラッグ/ピンチ直後の click を1回だけ捨てる（辺・ノードの誤選択防止）
const V1PTS = new Map(); // graphwrap 内で押下された pointerId → 座標（ピンチ検出用）
let SPLITH = 42;   // 図ペインの高さ（コンテナに対する %）
let SASH = false;  // split の境目をドラッグ中
// 規則表・マスタデータ（共有リソース）は検証対象の流れではないので図から外す。
// 同じ文書から起こした取り込み（歳出・歳入が同じ PDF）は原典を1つにまとめる —
// 実装は証跡の sha256 集合で判定するが、data.js の原典ノードは文書の URL を
// description に持つのでそれで代用する
function J() {
  const j = DATA[S.code];
  const keep = [];
  const origins = new Map();
  for (const n of j.topology.nodes) {
    if (isRes(n)) continue;
    if (n.kind === 'origin') {
      const key = `${n.jurisdictionCode}|${n.description || n.label}`;
      if (!origins.has(key)) origins.set(key, []);
      origins.get(key).push(n);
      continue;
    }
    keep.push(n);
  }
  const mergedOf = new Map();
  let gi = 0;
  for (const members of origins.values()) {
    if (members.length === 1) { keep.push(members[0]); continue; }
    const code = members[0].jurisdictionCode;
    const id = `source.fudoki.raw_${code}.doc${gi++}.origin`;
    const byYear = {};
    for (const m of members) {
      const rb = m.rowsByJurisdiction?.[code]?.byYear;
      for (const [y, n] of Object.entries(rb || {})) byYear[y] = (byYear[y] || 0) + n;
    }
    const total = members.reduce((s, m) => s + (m.rows || 0), 0);
    keep.push({ ...members[0], id, rows: total, rowsByJurisdiction: { [code]: { total, byYear } } });
    for (const m of members) mergedOf.set(m.id, id);
  }
  const edges = j.topology.edges.map((e) => ({ ...e, from: mergedOf.get(e.from) ?? e.from }));
  const ids = new Set(keep.map((n) => n.id));
  return { ...j, topology: { ...j.topology, nodes: keep, edges: edges.filter((e) => ids.has(e.from) && ids.has(e.to)) } };
}
function pushUrl() {
  const url = new URL(location);
  url.searchParams.delete('v');
  url.searchParams.set('j', S.code);
  url.searchParams.set('y', S.year);
  history.replaceState(null, '', url);
}

const STAGE_JA = { origin: '原典', ingestion: '取り込み', staging: '正規化', core: '判断', package: '配布物' };
const STAGE_ORDER = ['origin', 'ingestion', 'staging', 'core', 'package'];
const DIR = { expenditure: '歳出', revenue: '歳入' };
/* 原典の文書種別の語彙（正本は report/common.ts の DOCUMENT_PHASES）。
   「当初予算」とだけ書くと enum の1要素ではなく暗黙の前提に見えるので、
   収録していない種類も選択肢に残して disabled にする */

  const varSide = shared === 'in' ? 'out' : 'in';

  // バラつく側が持つ鍵の和集合 = 共有側の「対応あり」母数。共有側が持つ鍵 = 各側の母数
  const peerKeys = new Set();
  for (const e of pairs) {
    const n = nodeById.get(varSide === 'in' ? e.from : e.to);
    if (!n) continue;
    const d = edgeDir(e);
    const key = varSide === 'in' ? (n.kind === 'origin' ? `${e.to}.origin` : e.from) : e.to;
    const pdf = varSide === 'in' && j.samples[key]?.kind === 'pdf';
    const ks = sideKeySet(j, n, key, d, pdf);
    if (ks) ks.forEach((k) => peerKeys.add(k));
  }
  const sharedKeys = sideKeySet(j, sharedNode, sharedKey, dir, aPdf);

  const sharedName = sharedNode.kind === 'origin' ? '原典' : nodeLabel(sharedNode, j);
  const sharedHead = shared === 'in'
    ? (sharedNode.kind === 'origin' ? `原典（${aPdf ? 'PDF' : 'CSV'}）` : `入力 — ${esc(sharedName)}`)
    : esc(sharedName);
  // 変換の説明 = 出力側ノードの段の責務。共有出力では全組で同じなので1回だけ出す
  // （共有入力では出力ごとに違うので各側の見出しの下に出す）
  const sSt = j.topology.stages.find((s) => s.id === sharedNode.stage);
  const sharedLead = shared === 'out' && sSt
    ? `<p class="mut" style="font-size:12px;margin:-2px 0 8px">${esc(sSt.responsibility)}</p>` : '';
  const sharedSide = `<div class="side" data-ctx="${esc(starCtx)}"><h3>${sharedHead}${sst.row != null ? ` <button class="linky small" data-clear-row>行 ${sst.row} の選択を解除</button>` : ''}</h3>${sharedLead}`
    + (aPdf ? pdfSideHtml(j, dir || 'expenditure', peerKeys, sst) : tableHtml(j, sharedKey, dir, 'in', peerKeys, sst))
    + ioSideDetailHtml(j, sharedNode, dir, { isInput: shared === 'in', aPdf, srcIds: sharedNode.kind === 'origin' ? pairs.map((e) => e.to) : [], tblKey: sharedKey, tblDir: dir })
    + `</div>`;

  const varBlocks = pairs.map((e) => {
    const n = nodeById.get(varSide === 'in' ? e.from : e.to);
    if (!n) return '';
    const d = edgeDir(e);
    const key = varSide === 'in' ? (n.kind === 'origin' ? `${e.to}.origin` : e.from) : e.to;
    const pdf = varSide === 'in' && j.samples[key]?.kind === 'pdf';
    const own = ctxOf(`${e.from}|${e.to}`);
    const name = n.kind === 'origin' ? '原典' : nodeLabel(n, j);
    // ノード名が既に向きを名乗っている組（例: expenditure（歳出））でメタの「歳出」を重複させない
    const dirShown = d && (name.includes(DIR[d]) || sharedName.includes(DIR[d]));
    const meta = [d && !dirShown && DIR[d], `${S.year}年度`].filter(Boolean).join(' ／ ');
    const nSt = j.topology.stages.find((s) => s.id === n.stage);
    const nlead = varSide === 'out' && nSt
      ? `<p class="mut" style="font-size:12px;margin:-2px 0 8px">${esc(nSt.responsibility)}</p>` : '';
    return `<div class="io-node" data-ctx="${esc(e.from)}|${esc(e.to)}"><h3>${varSide === 'in' ? `${esc(name)} →` : `→ ${esc(name)}`}${meta ? ` <span class="mut">${meta}</span>` : ''}`
      + `<button class="pair-x" data-rmpair title="この組を外す" aria-label="この組を外す">✕</button></h3>${nlead}`
      + (pdf ? pdfSideHtml(j, d || 'expenditure', sharedKeys, own) : tableHtml(j, key, d, varSide, sharedKeys, own))
      + ioSideDetailHtml(j, n, d, { isInput: varSide === 'in', aPdf: pdf, srcIds: n.kind === 'origin' ? [e.to] : [], tblKey: key, tblDir: d })
      + `</div>`;
  }).join('');

  return `<div class="io-pair" data-star="${esc(starCtx)}"><div class="io">`
    + (shared === 'in' ? sharedSide : '')
    + `<div class="side">${varBlocks}</div>`
    + (shared === 'out' ? sharedSide : '')
    + `</div></div>`;
}
/* サイドごとの詳細トグル。あるものだけ出す:
   - 入力側に原典が来る組 … 資料名・取得元 URL（リンク）・形式・ページ範囲・証跡（PDF は突き合わせ、
     CSV は復元検査と sha256）・取得日時
   - どの側でも … そのノードを守る検査の一覧（あれば）
   両方無い側はトグル自体を出さない */
function ioSideDetailHtml(j, node, dir, { isInput, aPdf, srcIds, tblKey, tblDir }) {
  const checks = j.checks.filter((c) => c.binds.includes(node.id)
    || (isInput && node.kind === 'origin' && srcIds && srcIds.some((s) => c.binds.includes(s))));
  const bad = checks.filter((c) => c.status !== 'pass' && c.status !== 'warn').length;
  const warn = checks.filter((c) => c.status === 'warn').length;
  const ckBad = [bad && `失敗${bad}`, warn && `警告${warn}`].filter(Boolean).join('・');
  const isOrigin = isInput && node.kind === 'origin';
  const ings = isOrigin && dir ? j.ingestion.filter((i) => i.direction === dir) : [];
  const ing = ings.find((i) => i.fiscal_year === S.year) || ings[0] || null;
  // 見えている表の列のうち語彙が引けるもの（原典の列は原典自身の見出しなので引かない）
  const docMap = node ? colDocsOf(node) : {};
  const tblCols = (tblKey ? pickEntry(j, tblKey, tblDir) : null)?.columns ?? [];
  const docCols = tblCols.filter((c) => docMap[c]);
  if (!ing && !checks.length && !docCols.length) return '';
  const summary = isOrigin && ing
    ? `詳細${checks.length ? `（検査${ckBad ? ` ${ckBad}` : ` ${checks.length}件`}）` : ''}`
    : checks.length
      ? ckBad ? `検査 ${checks.length}件（${ckBad}）` : `検査 ${checks.length}件：すべて成功`
      : `列の意味 ${docCols.length}列`;
  let body = '';
  if (ing) {
    const title = ing.document_title || ing.dataset_title || ing.resource_name || '';
    const link = (u) => `<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>`;
    const urlRows = `<div class="drow"><span class="dk">取得元</span><span>${link(ing.request_url)}</span></div>`;
    const ex = ing.extracted || {};
    // PDF は抽出なので「原典へ戻して比べる」検査は成立しない。代わりに様式内の重複印字どうしを
    // 突き合わせた結果を、検査と同じ見た目で並べる。CSV なら復元検査がその役割になる
    const ver = ing.raw_form === 'extracted'
      ? [`葉の合計と、同じ PDF 内の目の印字額が一致（${fmt(ex.leavesReconciled)}/${fmt(ex.leaves)} 行）`,
         `抽出した目すべてに、金額つきの見出しが PDF 内にあった（${fmt(ex.mokuHeadersFound)}/${fmt(ex.moku)}）`]
      : [`原典の CSV から同じ表を再構成できる（sha256 ${esc((ing.sha256 || '').slice(0, 12))}…）`];
    body += (title ? `<div class="drow"><span class="dk">資料名</span><span>${esc(title)}</span></div>` : '')
      + `<div class="drow"><span class="dk">形式</span><span>${aPdf ? 'PDF（組版からの抽出）' : `CSV（そのまま取り込み${ing.encoding ? `・${esc(ing.encoding)}` : ''}）`}</span></div>`
      + urlRows
      + (ing.landing_page ? `<div class="drow"><span class="dk">公開ページ</span><span>${link(ing.landing_page)}</span></div>` : '')
      + (ing.pages ? `<div class="drow"><span class="dk">ページ範囲</span><span>p.${ing.pages[0]}–${ing.pages[1]}</span></div>` : '')
      + `<div class="drow"><span class="dk">取得</span><span class="mut">${esc(String(ing.fetched_at || '').slice(0, 10))} ・ ${fmt(ing.bytes)} B</span></div>`
      + `<div class="dh">取り込みの検証</div>`
      + ver.map((t) => `<div class="small" style="padding:2px 0"><span class="badge ${ing.raw_form === 'extracted' || ing.roundtrip_verified ? 'ok' : 'bad'}">${ing.raw_form === 'extracted' || ing.roundtrip_verified ? '一致' : '不一致'}</span> ${t}</div>`).join('');
  }
  if (docCols.length) {
    body += `<div class="dh">列の意味（${docCols.length}/${tblCols.length}列）</div>`
      + docCols.map((c) => `<div class="drow"><span class="dk mono">${esc(c)}</span><span>${esc([docMap[c].title, docMap[c].description].filter(Boolean).join(' — '))}</span></div>`).join('');
  }
  if (checks.length) {
    body += `<div class="dh">検査（${checks.length}件）</div>`
      + checks.map((c) => `<div class="small" style="padding:2px 0"><span class="badge ${c.status === 'pass' ? 'ok' : c.status === 'warn' ? 'plain' : 'bad'}">${c.status === 'pass' ? '成功' : c.status === 'warn' ? '警告' : '失敗'}</span> <span title="${esc(c.name)}">${esc(checkLabel(c))}</span>${c.status !== 'pass' && crossJur(c) ? `<span class="mut" title="${esc(c.binds.join(', '))}">（全団体を束ねた検査。警告・失敗がこの団体のものとは限らない）</span>` : ''}${c.detail && c.status !== 'pass' ? `<div class="mut" style="padding-left:44px">${esc(c.detail)}</div>` : ''}</div>`).join('');
  }
  return `<details class="fold"><summary>${esc(summary)}</summary>${body}</details>`;
}

    const k = Math.min(3, Math.max(Math.min(0.3, v1FitT().k), V1PINCH.k0 * Math.hypot(a.x - b.x, a.y - b.y) / V1PINCH.d0));
    V1Z.tx = mx - (V1PINCH.mx0 - V1PINCH.tx0) * (k / V1PINCH.k0);
    V1Z.ty = my - (V1PINCH.my0 - V1PINCH.ty0) * (k / V1PINCH.k0);
    V1Z.k = k; V1Z.fit = false; v1ApplyZ(); setV1Hover(null);
    return;
  }
  if (!V1DRAG || e.pointerId !== V1DRAG.id) return;
  const dx = e.clientX - V1DRAG.x0, dy = e.clientY - V1DRAG.y0;
  if (!V1DRAG.active) {
    if (dx * dx + dy * dy < 36) return; // 6px 未満はクリックとして扱う（辺選択・ノード候補ポップを壊さない）
    V1DRAG.active = true;
    stage.querySelector('.v1 .graphsvg')?.classList.add('panning');
    setV1Hover(null);
  }
  V1Z.tx = V1DRAG.tx0 + dx; V1Z.ty = V1DRAG.ty0 + dy; V1Z.fit = false;
  v1ApplyZ();
});
const v1PointerEnd = (e) => {
  if (SASH) { SASH = false; stage.querySelector('.splitsash.drag')?.classList.remove('drag'); }
  V1PTS.delete(e.pointerId);
  if (V1PINCH && V1PTS.size < 2) { V1PINCH = null; V1DRAG = null; V1NOCLICK = true; setTimeout(() => { V1NOCLICK = false; }, 100); }
  if (V1DRAG && e.pointerId === V1DRAG.id) {
    if (V1DRAG.active) { V1NOCLICK = true; setTimeout(() => { V1NOCLICK = false; }, 100); }
    V1DRAG = null;
    stage.querySelector('.v1 .graphsvg')?.classList.remove('panning');
  }
};
window.addEventListener('pointerup', v1PointerEnd);
window.addEventListener('pointercancel', v1PointerEnd);
stage.addEventListener('change', (e) => {
  const y = e.target.closest('[data-year]');
  if (y) { S.year = Number(y.value); V1Z = null; pushUrl(); mount(); }
});
function scrollSelIntoView() {
  requestAnimationFrame(() => {
    document.querySelectorAll('tr[data-rowsel], .pdfpage .hit').forEach((el) => el.scrollIntoView({ block: 'nearest' }));
  });
}

function mount() {
  V1HOV = null;
  stage.innerHTML = vSplit();
  v1InitZoom();
  requestAnimationFrame(() => scrollSelIntoView());
}
window.addEventListener('resize', () => {
  // svg の大きさはコンテナに合わせているので、リサイズ時は張り直す。fit モードなら合わせ直す
  if (v1SizeSvg()) { if (!V1Z || V1Z.fit) V1Z = v1FitT(); v1ApplyZ(); }
});
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'r' || e.key === 'R') mount();
});
mount();
</script>
</body>
