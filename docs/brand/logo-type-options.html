for(const [i,v]of DATA.entries()){const s=document.createElement("section");s.innerHTML=`<h2>${v.id.toUpperCase()} · ${v.font}</h2><p class="description">${DESCRIPTIONS[i]}</p><div class="samples" data-samples><div class="sample"><img data-font="${v.id}" data-kind="logo" alt="${v.font}の横組み・拡大"></div><div class="small"><img data-font="${v.id}" data-kind="logo" alt="${v.font}の横組み・実サイズ"><span>高さ40px</span></div><div class="word"><img data-font="${v.id}" data-kind="wordmark" alt="${v.font}の文字単体"><span>文字だけ</span></div></div><button type="button" class="control" data-pick-font="${v.id}" aria-pressed="${v.id===selected}">${v.id.toUpperCase()}を実画面へ</button><figure><img class="context" data-product="${v.id}" alt="${v.font}を使った実画面の抜粋"><figcaption>実画面 · ロゴ40px · 下線0.6</figcaption></figure>`;$("fonts").append(s);s.querySelector("button").addEventListener("click",()=>{selected=v.id;radius=.6;render();openLive()});const a=document.createElement("a");a.href=v.source.source;a.textContent=v.font;$("sources").append(a)}
for(const [r,label]of [[.25,"控えめ"],[.6,"少し丸い"],[1,"丸い"]]){const s=document.createElement("section");s.innerHTML=`<h2>${label} · ${r}</h2><div class="samples" data-samples><div class="sample"><img data-radius="${r}" alt="下線の角丸${r}の横組み・拡大"></div><div class="small"><img data-radius="${r}" alt="下線の角丸${r}の横組み・実サイズ"><span>高さ40px</span></div></div><button class="control" type="button" data-pick-radius="${r}" aria-pressed="${r===radius}">${r}を実画面へ</button>`;$("rules").append(s);s.querySelector("button").addEventListener("click",()=>{radius=r;render();openLive()})}
function render(){const dark=$("dark").checked;for(const i of document.querySelectorAll("img[data-font]"))i.src=asset(i.dataset.font,i.dataset.kind);for(const i of document.querySelectorAll("img[data-radius]"))i.src=asset(selected,"logo",Number(i.dataset.radius));for(const i of document.querySelectorAll("img[data-product]")){const src=DATA.find(v=>v.id===i.dataset.product).products[dark?"dark":"light"];i.closest("figure").hidden=!src;if(src)i.src=src}for(const p of document.querySelectorAll("[data-samples]"))p.classList.toggle("dark",dark);for(const b of document.querySelectorAll("[data-pick-font]"))b.setAttribute("aria-pressed",String(b.dataset.pickFont===selected));for(const b of document.querySelectorAll("[data-pick-radius]"))b.setAttribute("aria-pressed",String(Number(b.dataset.pickRadius)===radius));const font=DATA.find(v=>v.id===selected);$("ruleNote").textContent="文字："+font.font+"。文字タブで選んだ案と組み合わせます。";$("liveTitle").textContent="実画面で確認 · "+selected.toUpperCase()+" / 下線 "+radius;updateProduct()}
function tab(next){mode=next;for(const m of ["font","rule"]){$(m+"Panel").hidden=m!==mode;$(m+"Tab").setAttribute("aria-selected",String(m===mode));$(m+"Tab").tabIndex=m===mode?0:-1}}
for(const m of ["font","rule"]){$(m+"Tab").addEventListener("click",()=>tab(m));$(m+"Tab").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();tab(mode==="font"?"rule":"font");$(mode+"Tab").focus()}})}
$("dark").addEventListener("change",render);
function openLive(){$("live").open=true;loadProduct()}
function loadProduct(){if($("product").getAttribute("src"))return;if(!location.protocol.startsWith("http")){$("liveStatus").textContent="実画面はローカル開発サーバーから確認できます。";return}$("liveStatus").textContent="実画面を読み込んでいます…";$("product").hidden=false;$("product").src=location.origin+"/pipeline/"}
$("live").addEventListener("toggle",()=>{if($("live").open)loadProduct()});
function updateProduct(){if(!ready)return;const d=$("product").contentDocument;d.documentElement.classList.toggle("dark",$("dark").checked);d.documentElement.style.setProperty("--primary",DATA[0].accent);for(const i of d.images){const n=i.dataset.logoTypeAsset||(i.getAttribute("src")||"").split("/").pop();if(!/^(logo|mark)(-dark)?\.svg$/.test(n))continue;i.dataset.logoTypeAsset=n;i.src=asset(selected,n.startsWith("mark")?"mark":"logo",radius,n.includes("-dark"))}$("liveStatus").textContent="適用中："+selected.toUpperCase()+" / 下線 "+radius+"。強調色は元のオレンジです。"}
$("product").addEventListener("load",()=>{const d=$("product").contentDocument;function connect(){const i=Array.from(d.images).find(i=>(i.getAttribute("src")||"").endsWith("/logo.svg"));if(!i)return false;ready=true;updateProduct();const r=i.getBoundingClientRect();d.defaultView.scrollTo(0,d.defaultView.scrollY+r.top-(d.defaultView.innerHeight-r.height)/2);return true}if(connect())return;const observer=new MutationObserver(()=>{if(connect())observer.disconnect()});observer.observe(d.documentElement,{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();if(!ready)$("liveStatus").textContent="実画面を読み込めませんでした。"},8000)});
render();window.logoTypePreview={getState:()=>({selected,radius,dark:$("dark").checked,ready}),asset};
</script></body></html>
