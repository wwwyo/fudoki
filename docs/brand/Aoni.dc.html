<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Geist:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', system-ui, sans-serif; }
    a { color: #c1553a; }
    a:hover { color: #2f5d43; }
  </style>
</helmet>
<div style="width: 720px; height: 600px; box-sizing: border-box; padding: 40px; background: {{paper}}; display: flex; flex-direction: column; gap: 26px">

  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 22px; color: {{ink}}">青丹</span>
    <span style="font-size: 12px; color: #8a857c">あをに</span>
    <span style="margin-left: auto; font-family: Geist, ui-monospace, monospace; font-size: 12px; color: #8a857c">{{ink}}</span>
  </div>

  <div style="display: flex; align-items: center; gap: 22px">
    <svg viewBox="0 0 32 32" width="76" height="76" style="flex: none; fill: {{ink}}"><g><rect x="2" y="14" width="4" height="14" rx="2"></rect><rect x="8" y="6" width="4" height="22" rx="2"></rect><rect x="14" y="18" width="4" height="10" rx="2"></rect><rect x="20" y="2" width="4" height="26" rx="2"></rect><rect x="26" y="11" width="4" height="17" rx="2"></rect><rect x="2" y="29" width="28" height="2" rx="1"></rect></g></svg>
    <span style="font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 68px; line-height: 1; letter-spacing: 0.04em; color: {{ink}}; transform: translateY(4px)">風土記</span>
  </div>

  <div style="display: flex; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 96px; height: 56px; border-radius: 4px; background: {{ink}}"></div><div style="font-size: 12px; font-weight: 500; color: {{ink}}">主色</div><div style="font-size: 11px; color: #8a857c; font-family: Geist, system-ui, sans-serif">ロゴ・見出し</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 96px; height: 56px; border-radius: 4px; background: {{paper}}"></div><div style="font-size: 12px; font-weight: 500; color: {{ink}}">地色</div><div style="font-size: 11px; color: #8a857c; font-family: Geist, system-ui, sans-serif">og・ロゴの背景</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 96px; height: 56px; border-radius: 4px; background: {{accent}}"></div><div style="font-size: 12px; font-weight: 500; color: {{ink}}">差し色</div><div style="font-size: 11px; color: #8a857c; font-family: Geist, system-ui, sans-serif">リンク・強調</div></div>
  </div>

  <div style="border-top: 1px solid #ddd6c9; padding-top: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 11px; font-weight: 500; color: #8a857c">画面の意味色と並べたとき</div>
    <div style="display: flex; flex-wrap: wrap; gap: 14px"><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #577ea5"></i><span style="font-size: 11px; color: #57534e">判断なし</span></div><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #a16c48"></i><span style="font-size: 11px; color: #57534e">判断あり</span></div><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #aa5910"></i><span style="font-size: 11px; color: #57534e">境界</span></div><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #3d865a"></i><span style="font-size: 11px; color: #57534e">割当済み</span></div><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #a97416"></i><span style="font-size: 11px; color: #57534e">分類不能</span></div><div style="display: flex; align-items: center; gap: 5px"><i style="width: 10px; height: 10px; border-radius: 2px; background: #79818d"></i><span style="font-size: 11px; color: #57534e">対象外</span></div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px; margin-top: auto">
    <div style="font-size: 13px; line-height: 1.7; color: {{ink}}">「あをによし」は奈良の都にかかる枕詞で、青（岩緑青）と丹（赤土）という顔料そのものを指す。713年の官命という出自に最も近い。</div>
    <div style="font-size: 12px; line-height: 1.7; color: #8a6a5a">引き換えに: 緑は「割当済み」#3d865a と近い。COFOG が付いた状態の色と混ざる。</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"ink": {"editor": "color", "default": "#2f5d43"}, "paper": {"editor": "color", "default": "#f4f1e6"}, "accent": {"editor": "color", "default": "#c1553a"}, "$preview": {"width": 720, "height": 600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ink: this.props.ink ?? '#2f5d43',
      paper: this.props.paper ?? '#f4f1e6',
      accent: this.props.accent ?? '#c1553a',
    };
  }
}
</script>
</body>
</html>
