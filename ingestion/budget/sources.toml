redistribute_basis = "東京都オープンデータカタログのライセンス表示（CC BY 4.0）"
license_id = "CC-BY-4.0"
attribution = "三鷹市「令和6年度予算データ」（東京都オープンデータカタログサイト）"
landing_page = "https://www.city.mitaka.lg.jp/c_service/074/"

