#
# ⚠️ **PDF そのものは保存しない。** 落とすのは抽出結果だけで、原典のバイト列は毎回取り直す。
# 再配布の判断が CSV（CC BY）とは別レイヤーにあるため。
#
# ⚠️ **資料の構成が年度で変わる。** 2020〜2022 は「歳出事項別明細」が独立した PDF、
# 2023 は「主要な施策の成果説明書・決算資料」に統合され、その一部（20〜264ページ）が該当する。
# 一般化して吸収しようとしない（パーサ設計の原則5）。年度ごとに宣言する。
#
# ⚠️ **2018〜2019 は決算ページ自体が無い。** その2年度に事業名は付かない。

