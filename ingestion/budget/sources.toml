# ── 狛江市 132195 ────────────────────────────────────────────────────────────
#
# ⚠️ **三鷹市とは原典の作りが根本的に違う。** 実測（2026-08-22）で分かったこと。
#
#  1. **階層に名称が無い。** 款・項・目・大事業は数字コードだけの列で、名称の列が存在しない。
#     名称を持つのは会計（会計名称）と、行の最下位階層（科目名称）だけ。
#     三鷹市の「2桁コード + 名称」を1セルに詰める書式とは別物なので、
#     セルを分解する規則を団体ごとに宣言できるようにした（dbt_project.yml の budget_code_style）。
#  2. **中事業・小事業・細節・細々節は全行 `0`。** 列としては存在するが1件も使われていない
#     （歳出は 6 年度 13,461 行すべて、歳入は細々節が全行 `0`）。
#     「大事業・中事業・小事業の3階層がある」は列の話であって、中身は大事業までである。
#  3. **階層だけでは行が一意にならない。** 所属（部課）と予算区分（現年度・繰越明許・事故繰越）
#     まで含めて初めて一意になる（2023 歳出 2,224 行が 2,224 通り）。
#  4. **決算書なので金額が段階ごとに複数ある。** 歳出は予算額 / 予算計 / 執行累計、
#     歳入は予算現額 / 収入累計。FDP は phase を**行の列**として持つ設計なので、
#     package 段で段階ごとの行へ展開する（詳細は pkg_132195__*.sql）。
#  5. **歳入の予算現額だけ単位が千円。** 同じファイルの他の金額はすべて円。
#  6. **文字コードが年度で変わる。** 2018〜2021 は UTF-8（BOM 付き）、2022〜2023 は CP932。
#  7. **同じデータセット名が2件ある。** `/komae/R05/` 配下と `/komae/` 配下で中身が違う
#     （所属名称の改称、執行率の `-` と `****`）。R05 側が新しいので、
#     `resource_url_contains` で明示的に選ぶ。指定が無くて複数当たれば取得は止まる。
#
# 再配布はカタログのライセンス（CC BY 4.0）が根拠。③会議録の gate とは無関係。

["132195:2018"]
catalog = "tokyo"
jurisdiction_code = "132195"
jurisdiction_name = "狛江市"
fiscal_year = 2018
# 原典に年度の列はあるが（三鷹市には無かった）、照合はリソース名で行う。
# 列と partition が食い違っていないことは dbt の検査（source_year_matches_partition）が見る。
fiscal_year_label = "（2018）"
# 予算段階は**文書の種類**。決算書なので settlement。
# 行が持つ FDP の phase（approved / adjusted / executed）はこれとは別で、package 段で展開する。
phase_id = "settlement"
phase_label = "決算"
# ⚠️ 歳出と歳入が**別のデータセット**になっている（三鷹市は1データセットに2リソース）。
# データセット名はリソース側で宣言する。
encoding = "utf-8"
# 同名のデータセットが2件あるので、どちらを採るかを明示する（指定が無く複数当たれば取得は止まる）。
