<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fudoki — 東京都62団体 データ源調査</title>
<style>
:root{
  --bg:#fbfaf8; --fg:#1c1a17; --muted:#6b665e; --line:#e3ded5;
  --card:#fff; --ok:#2f7d4f; --ng:#b0453a; --warn:#9a6b1e; --accent:#3a5a8c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--fg:#eae6df;--muted:#9b958a;--line:#2f2c27;--card:#1e1c19;
        --ok:#6fbf8b;--ng:#e08b7f;--warn:#d7a54a;--accent:#8fb0dd}
}
:root[data-theme=dark]{--bg:#161513;--fg:#eae6df;--muted:#9b958a;--line:#2f2c27;--card:#1e1c19;
  --ok:#6fbf8b;--ng:#e08b7f;--warn:#d7a54a;--accent:#8fb0dd}
:root[data-theme=light]{--bg:#fbfaf8;--fg:#1c1a17;--muted:#6b665e;--line:#e3ded5;--card:#fff;
  --ok:#2f7d4f;--ng:#b0453a;--warn:#9a6b1e;--accent:#3a5a8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{padding:22px 20px 12px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px}
.wrap{padding:14px 20px 60px}
.notice{background:color-mix(in srgb,var(--warn) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:12.5px;line-height:1.75}
.notice b{color:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 13px;min-width:92px}
.stat b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11.5px}
.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
button.f{background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
button.f[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 11px;font-size:13px;min-width:190px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px}
th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;font-weight:600;
  padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;font-size:12px}
th.grp{border-left:1px solid var(--line)}
th:hover{color:var(--accent)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.grp{border-left:1px solid var(--line)}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.p-ng{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 45%,transparent)}
.p-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.p-mute{color:var(--muted);border-color:var(--line)}
.fam{font-size:12px;color:var(--muted)}
.dash{color:var(--line)}
.score{font-variant-numeric:tabular-nums;font-weight:600}
a{color:var(--accent)}
a.plain{text-decoration:none}
.det{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.det td{padding:12px 16px 16px}
.det h4{margin:0 0 6px;font-size:12.5px;color:var(--accent)}
.det dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 12px}
.det dt{color:var(--muted);font-size:12px;white-space:nowrap}
.det dd{margin:0;font-size:12.5px;word-break:break-all}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  overflow-x:auto;font-size:11.5px;line-height:1.5;margin:4px 0 0;white-space:pre-wrap}
.note{color:var(--muted);font-size:12px;line-height:1.65}
footer{color:var(--muted);font-size:12px;padding:0 20px 40px;line-height:1.75}
footer code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 4px}
h3{font-size:14px;margin:26px 0 8px}
</style>
</head>
<body>
<header>
  <h1>東京都62区市町村 — データ源の調査</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="wrap">
  <div class="notice" id="notice"></div>
  <div class="stats" id="stats"></div>
  <div class="controls" id="controls">
    <input type="search" id="q" placeholder="自治体名・ベンダー・理由で絞り込み">
  </div>
  <div class="tablewrap">
    <table id="t">
      <thead><tr>
        <th data-k="code">コード</th>
        <th data-k="name">自治体</th>
        <th class="grp" data-k="fam">会議録システム</th>
        <th data-k="fetch">取得</th>
        <th data-k="rec">記録種別</th>
        <th data-k="cmt">委員会</th>
        <th class="grp" data-k="_budget">予算・決算</th>
        <th data-k="_roster">議員名簿</th>
        <th data-k="_dayori">議会だより</th>
        <th data-k="_portal">独自ポータル</th>
        <th data-k="ds">都カタログ</th>
        <th class="grp" data-k="_score">揃い</th>
        <th data-k="conf">確度</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <h3>この表に写っていないこと</h3>
  <footer id="foot"></footer>
</div>

<script src="_data.js"></script>
<script>
const $=s=>document.querySelector(s);
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const e=v=>String(v??'').replace(/[&<>"']/g,c=>ESC[c]);
let sortK='code', sortAsc=true, filter=null, q='';

const FAMS=['dnp','db-search','voices','kensakusystem','own-site','none'];
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const dash='<span class="dash">—</span>';

// golden case 適性: 会議録が取得可 / 予算 / 議員名簿 が揃うほど高い
const score=r=>(r.fetch==='allow'?1:0)+(r.budget?1:0)+(r.roster?1:0);
DATA.forEach(r=>{
  r._budget=r.budget?r.budget.n:0; r._roster=r.roster?1:0;
  r._dayori=r.dayori?1:0; r._portal=r.portal?r.portal.type:''; r._score=score(r);
});

function odCell(v,label){
  if(!v) return dash;
  const fmt=e(v.fmt||'?'), n=v.n>1?` <span class="fam">${v.n}件</span>`:'';
  const body=`<span class="pill p-ok">${fmt}</span>${n}`;
  return v.url?`<a class="plain" href="${e(v.url)}" target="_blank" rel="noopener" title="${e(v.title)}">${body}</a>`:body;
}
function dayoriCell(v){
  if(!v) return dash;
  const c=v.scConf, cls=c==='conformant'?'p-ok':c==='variant'?'p-warn':'p-ng';
  const label=c==='conformant'?'標準':c==='variant'?'差異':c==='broken'?'壊れ':e(v.fmt||'?');
  const body=`<span class="pill ${cls}">${label}</span>`;
  const title=v.std?`${v.std}${v.scNote?' / '+v.scNote:''}`:'';
  return v.url?`<a class="plain" href="${e(v.url)}" target="_blank" rel="noopener" title="${e(title)}">${body}</a>`:body;
}
function portalCell(p){
  if(!p) return dash;
  const n=p.datasets!=null?` <span class="fam">${p.datasets}件</span>`:'';
  return `<a class="plain" href="${e(p.baseUrl)}" target="_blank" rel="noopener">`
       + `<span class="pill p-warn">${e(p.type).toUpperCase()}</span>${n}</a>`;
}

function render(){
  const rows=DATA.filter(r=>{
    if(filter && !filter(r)) return false;
    if(!q) return true;
    return (r.name+r.fam+r.reason+(r.notes||'')+r.code).toLowerCase().includes(q.toLowerCase());
  }).sort((a,b)=>{
    const x=a[sortK], y=b[sortK];
    const nx=x==null||x==='', ny=y==null||y==='';
    if(nx||ny) return nx&&ny?0:(nx?1:-1);            // 未確認は昇降とも末尾
    const norm=v=>typeof v==='boolean'?(v?1:0):v;
    const u=norm(x), v=norm(y);
    if(typeof u==='number'&&typeof v==='number') return (u-v)*(sortAsc?1:-1);
    return String(u).localeCompare(String(v),'ja')*(sortAsc?1:-1);
  });
  $('#tb').innerHTML=rows.map(r=>{
    const el=r.fetch==='allow'?pill('○','p-ok'):r.fetch==='review'?pill('照会','p-warn'):pill('✗','p-ng');
    const rec=r.rec==='full'?pill('全文','p-ok'):r.rec==='summary'?pill('要点','p-warn'):dash;
    const cmt=r.cmt===true?pill('あり','p-ok'):r.cmt===false?pill('なし','p-ng'):dash;
    const sc=r._score;
    const scCls=sc>=3?'p-ok':sc===2?'p-warn':'p-mute';
    const cf=r.conf==='confirmed'?'':pill(e(r.conf),'p-warn');
    const nm=r.url?`<a href="${e(r.url)}" target="_blank" rel="noopener">${e(r.name)}</a>`:e(r.name);
    return `<tr class="row" data-c="${e(r.code)}">
      <td class="code">${e(r.code)}</td><td>${nm}</td>
      <td class="grp fam">${e(r.fam)}</td>
      <td>${el} <span class="fam">${e(r.reason)}</span></td>
      <td>${rec}</td><td>${cmt}</td>
      <td class="grp">${odCell(r.budget,'予算')}</td>
      <td>${odCell(r.roster,'議員名簿')}</td>
      <td>${dayoriCell(r.dayori)}</td>
      <td>${portalCell(r.portal)}</td>
      <td class="code">${r.dsCount??dash}</td>
      <td class="grp"><span class="score">${pill(sc+'/3',scCls)}</span></td>
      <td>${cf||dash}</td>
    </tr>
    <tr class="det" id="d-${e(r.code)}" hidden><td colspan="13">
      <div class="cols">
        <div>
          <h4>会議録</h4>
          <dl>
            <dt>URL</dt><dd>${r.url?`<a href="${e(r.url)}" target="_blank" rel="noopener">${e(r.url)}</a>`:dash}</dd>
            <dt>ベンダー</dt><dd>${e(r.fam)}${r.tenant?` / tenant=<code>${e(r.tenant)}</code>${r.tenantId!=null?` id=${e(r.tenantId)}`:' <span class="fam">（tenantId 未取得）</span>'}`:''}</dd>
            <dt>robots</dt><dd>${e(r.verdict)} / AIクローラ: ${e(r.ai)}</dd>
            <dt>取得（fetch）</dt><dd>${r.fetch==='allow'?'○ 取得してよい':r.fetch==='review'?'照会待ち — 確認が済むまで取得しない':'✗ 取得しない'}${r.gateNote?`<br><span class="fam">${e(r.gateNote)}</span>`:''}</dd>
            <dt>再配布（redistribute）</dt><dd>${r.redist==='allow'?'○':r.redist==='review'?'未確定 — 権利確認が済むまで公開しない':'✗'}</dd>
            <dt>制約</dt><dd>${r.constraints.length?r.constraints.map(c=>`<code>${e(c)}</code>`).join(' '):dash}</dd>
            <dt>根拠URL</dt><dd>${r.ev.length?r.ev.map(u=>`<a href="${e(u)}" target="_blank" rel="noopener">${e(u)}</a>`).join('<br>'):dash}</dd>
          </dl>
        </div>
        <div>
          <h4>オープンデータ</h4>
          <dl>
            <dt>予算・決算</dt><dd>${r.budget?`${e(r.budget.title)}<br><span class="fam">${e(r.budget.fmt)} / ${e(r.budget.n)}件 / ${e(r.budget.license)}</span>`:dash}</dd>
            <dt>議員名簿</dt><dd>${r.roster?`${e(r.roster.title)}<br><span class="fam">${e(r.roster.fmt)} / ${e(r.roster.license)}</span>`:dash}</dd>
            <dt>調達</dt><dd>${r.proc?`${e(r.proc.title)}<br><span class="fam">${e(r.proc.fmt)}</span>`:`${dash} <span class="fam">共通の官公需APIで取得（下記参照）</span>`}</dd>
            <dt>議会だより</dt><dd>${r.dayori?`${e(r.dayori.title)}<br><span class="fam">${e(r.dayori.fmt)} / ${e(r.dayori.license)}</span>`+
              (r.dayori.std?`<br><span class="fam">スキーマ: <code>${e(r.dayori.std)}</code> — ${e(r.dayori.scConf)}${r.dayori.extra?` / 追加列: ${e(r.dayori.extra.join(', '))}`:''}${r.dayori.scNote?` / ${e(r.dayori.scNote)}`:''}</span>`:''):dash}</dd>
            <dt>独自ポータル</dt><dd>${r.portal?`${e(r.portal.type)} — <a href="${e(r.portal.baseUrl)}" target="_blank" rel="noopener">${e(r.portal.baseUrl)}</a>${r.portal.datasets!=null?` <span class="fam">${r.portal.datasets}件</span>`:''}`:dash}</dd>
          </dl>
        </div>
      </div>
      ${r.notes?`<div class="note">${e(r.notes)}</div>`:''}
      ${r.obs?`<div class="note">robots 原文: <a href="${e(r.obs.requestUrl)}" target="_blank" rel="noopener">${e(r.obs.requestUrl)}</a> — HTTP ${e(r.obs.status)} / ${r.obs.sha256?`sha256 <code>${e(r.obs.sha256.slice(0,16))}</code>`:'本文なし'} / ${e(r.obs.fetchedAt)}<br>全文は <code>data/observations/robots.json</code></div>`:''}
    </td></tr>`;
  }).join('');
  $('#tb').querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{
    const d=$('#d-'+tr.dataset.c); d.hidden=!d.hidden;
  });
}

function boot(){
  const n=f=>DATA.filter(f).length;
  $('#stats').innerHTML=[
    ['62','調査団体'],[n(r=>r.fetch==='allow'),'取得してよい'],[n(r=>r.fetch==='review'),'照会待ち'],[n(r=>r.redist==='allow'),'再配布可'],
    [n(r=>r.budget),'予算あり'],[n(r=>r.roster),'議員名簿あり'],[n(r=>r.dayori),'議会だより'],
    [n(r=>r.portal),'独自ポータル'],[n(r=>r.dayori&&r.dayori.scConf==='conformant'),'議会だより標準準拠'],[n(r=>r._score>=2),'2/3 以上揃う'],
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

  $('#notice').innerHTML=
    `<b>この表の読み方</b> ｜ `+
    `<b>調達</b>は自治体別ではなく <a href="https://www.kkj.go.jp/api/" target="_blank" rel="noopener">官公需情報ポータルの検索API</a>（中小企業庁・e-Gov 登録）で全国分が取れる。`+
    `CityCode が団体コード、ProjectDescription に公告全文。robots 制限なし。表の「調達」が練馬1件なのは<b>都カタログに個別登録しているのが練馬だけ</b>という意味で、他が取れないわけではない。<br>`+
    `<b>都カタログの件数は実体より小さい。</b>実測で北区は区サイトに CSV22+XLS14 あるのに登録7件、渋谷区は ArcGIS に122件あるのに登録17件、港区は独自CKANに560件（登録268件）。`+
    `<b>予算・議員名簿の「なし」は「存在しない」ではなく「都カタログに登録が無い」</b>。<br>`+
    `<b>記録種別と委員会の「—」は未確認</b>で、実際に取得しないと埋まらない。<br>`+
    `<b>議会だより</b>はデータセット名が揺れる（議会だより / めぐろ区議会だより / 区議会だより一覧 / 【事業案内】みたか議会だより）ため、`+
    `名称ではなく<b>CSV の列構成</b>で判定している。42団体中40団体が同一ヘッダで、これを `+
    `<code>fudoki/tokyo-municipal-bulletin-profile/0.1</code> と名付けて管理している。`+
    `<b>公式標準ではない</b>——デジタル庁の自治体標準オープンデータセットの定義書3種を実際に確認したが広報紙のテーマは無かった。`;

  const cs=$('#controls');
  const mk=(label,fn)=>{const b=document.createElement('button');b.className='f';b.textContent=label;
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';
      cs.querySelectorAll('button.f').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed',on?'false':'true'); filter=on?null:fn; render();};
    cs.appendChild(b);};
  mk('取得してよい',r=>r.fetch==='allow');
  mk('2/3 以上揃う',r=>r._score>=2);
  mk('予算あり',r=>!!r.budget);
  mk('議員名簿あり',r=>!!r.roster);
  mk('独自ポータル',r=>!!r.portal);
  mk('照会待ち',r=>r.fetch==='review');
  FAMS.forEach(f=>mk(f,r=>r.fam===f));

  $('#meta').textContent=`${META.generatedAt} 実測 / 団体コード（全国地方公共団体コード）が主キー`;
  $('#foot').innerHTML=
    `<b>調達</b> — 東京電子自治体共同運営（56自治体参加）と東京都電子調達システムは robots が <code>Disallow: /*/</code> で全面拒否。`+
    `国の官公需情報ポータルが集約して開いているのでそちら経由で取る。<br>`+
    `<b>会議録本文のオープンデータ</b> — 東京62団体で <b>0件</b>（「速記」「発言」で検索ヒット0）。都カタログにあるのは開催回数・議決件数といった数えられるものだけ。<br>`+
    `<b>CKAN / DCAT</b> — 都カタログ・港区・BODIK は CKAN、渋谷区は ArcGIS の DCAT-US フィード。標準APIで引けるので独自ポータルも同じコードで取れる。<br>`+
    `<b>ライセンス</b> — 都カタログ全9,648件中9,645件が CC-BY-4.0。<code>isopen</code> で機械判定できる。<br><br>`+
    `<b>判断の方針（policy ${e(META.policy.version)}）</b>: ${e(META.policy.rule)}<br>`+
    Object.entries(META.policy.constraints).map(([k,v])=>`<code>${e(k)}</code> — ${e(v)}`).join('<br>');

  $('#q').oninput=ev=>{q=ev.target.value;render()};
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; sortAsc=(k===sortK)?!sortAsc:true; sortK=k; render();
  });
  render();
}
boot();
</script>
</body>
</html>
