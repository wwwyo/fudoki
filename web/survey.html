<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kotonoha — 東京都62団体 データ源調査</title>
<style>
:root{
  --bg:#fbfaf8; --fg:#1c1a17; --muted:#6b665e; --line:#e3ded5;
  --card:#fff; --ok:#2f7d4f; --ng:#b0453a; --warn:#9a6b1e; --accent:#3a5a8c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--fg:#eae6df;--muted:#9b958a;--line:#2f2c27;--card:#1e1c19;
        --ok:#6fbf8b;--ng:#e08b7f;--warn:#d7a54a;--accent:#8fb0dd}
}
:root[data-theme=dark]{--bg:#161513;--fg:#eae6df;--muted:#9b958a;--line:#2f2c27;--card:#1e1c19;
  --ok:#6fbf8b;--ng:#e08b7f;--warn:#d7a54a;--accent:#8fb0dd}
:root[data-theme=light]{--bg:#fbfaf8;--fg:#1c1a17;--muted:#6b665e;--line:#e3ded5;--card:#fff;
  --ok:#2f7d4f;--ng:#b0453a;--warn:#9a6b1e;--accent:#3a5a8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{padding:22px 20px 14px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px}
.wrap{padding:16px 20px 60px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 13px;min-width:96px}
.stat b{display:block;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11.5px}
.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
button.f{background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
button.f[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 11px;font-size:13px;min-width:200px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:940px;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;
  padding:9px 11px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;font-size:12px}
th:hover{color:var(--accent)}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid}
.p-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.p-ng{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 45%,transparent)}
.p-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.p-mute{color:var(--muted);border-color:var(--line)}
.fam{font-size:12px;color:var(--muted)}
a{color:var(--accent)}
.det{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.det td{padding:12px 16px 16px}
.det dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;margin:0 0 10px}
.det dt{color:var(--muted);font-size:12px;white-space:nowrap}
.det dd{margin:0;font-size:12.5px;word-break:break-all}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  overflow-x:auto;font-size:11.5px;line-height:1.5;margin:4px 0 0;white-space:pre-wrap}
.note{color:var(--muted);font-size:12px;line-height:1.65}
.od{display:flex;gap:5px;flex-wrap:wrap}
.od a{text-decoration:none}
footer{color:var(--muted);font-size:12px;padding:0 20px 40px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>東京都62区市町村 — 会議録・オープンデータ源の調査</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="controls" id="controls">
    <input type="search" id="q" placeholder="自治体名・ベンダー・理由で絞り込み">
  </div>
  <div class="tablewrap">
    <table id="t">
      <thead><tr>
        <th data-k="code">コード</th>
        <th data-k="name">自治体</th>
        <th data-k="fam">会議録システム</th>
        <th data-k="verdict">robots</th>
        <th data-k="ai">AI</th>
        <th data-k="eligible">取得</th>
        <th data-k="reason">理由</th>
        <th data-k="cmt">委員会</th>
        <th data-k="rec">記録</th>
        <th>オープンデータ</th>
        <th data-k="ds">OD数</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>
<footer id="foot"></footer>

<script src="_data.js"></script>
<script>
const $=s=>document.querySelector(s);
let sortK='code', sortAsc=true, filter=null, q='';

const FAMS=['dnp','db-search','voices','kensakusystem','own-site','none'];
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const yn=v=>v===true?'あり':v===false?'なし':'—';

function odCell(r){
  const out=[];
  const add=(k,label)=>{ const v=r[k]; if(!v) return;
    out.push(v.url?`<a class="pill p-mute" href="${v.url}" target="_blank" rel="noopener" title="${(v.title||'').replace(/"/g,'')}">${label}${v.n>1?' '+v.n:''}</a>`
                      :`<span class="pill p-mute">${label}</span>`); };
  add('budget','予算'); add('roster','議員名簿'); add('proc','調達'); add('dayori','議会だより');
  if(r.portal) out.push(`<span class="pill p-warn">独自${r.portal.type.toUpperCase()}</span>`);
  return `<div class="od">${out.join('')||'<span class="fam">—</span>'}</div>`;
}

function render(){
  const rows=DATA.filter(r=>{
    if(filter && !filter(r)) return false;
    if(!q) return true;
    const s=(r.name+r.fam+r.reason+(r.notes||'')+r.code).toLowerCase();
    return s.includes(q.toLowerCase());
  }).sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='boolean'){x=x?1:0;y=y?1:0;}
    x=x??''; y=y??'';
    return (x<y?-1:x>y?1:0)*(sortAsc?1:-1);
  });
  $('#tb').innerHTML=rows.map(r=>{
    const el=r.eligible?pill('○','p-ok'):pill('✗','p-ng');
    const ai=r.ai==='disallowed'?pill('拒否','p-ng'):r.ai==='unchecked'?pill('未確認','p-warn'):pill('—','p-mute');
    const vd={'allowed':'p-ok','none':'p-ok','partial':'p-warn','disallow-all':'p-ng'}[r.verdict]||'p-mute';
    const nm=r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.name}</a>`:r.name;
    return `<tr class="row" data-c="${r.code}">
      <td class="code">${r.code}</td><td>${nm}</td>
      <td class="fam">${r.fam}</td>
      <td>${pill(r.verdict,vd)}</td><td>${ai}</td>
      <td>${el}</td><td class="fam">${r.reason}${r.revisit?' <span class="pill p-warn">許諾で解除可</span>':''}</td>
      <td class="fam">${yn(r.cmt)}</td><td class="fam">${r.rec||'—'}</td>
      <td>${odCell(r)}</td><td class="code">${r.ds??'—'}</td>
    </tr>
    <tr class="det" id="d-${r.code}" hidden><td colspan="11">
      <dl>
        <dt>会議録URL</dt><dd>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.url}</a>`:'—'}</dd>
        <dt>確度</dt><dd>${r.conf||'—'}</dd>
        <dt>根拠URL</dt><dd>${r.ev.length?r.ev.map(u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).join('<br>'):'—'}</dd>
      </dl>
      ${r.notes?`<div class="note">${r.notes}</div>`:''}
      ${r.raw?`<pre>${r.raw.replace(/</g,'&lt;')}</pre>`:''}
    </td></tr>`;
  }).join('');
  $('#tb').querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{
    const d=$('#d-'+tr.dataset.c); d.hidden=!d.hidden;
  });
}

function stats(){
  const n=k=>DATA.filter(k).length;
  const cards=[
    ['62','調査団体'],
    [n(r=>r.eligible),'取得対象'],
    [n(r=>!r.eligible&&r.revisit),'許諾で解除可'],
    [n(r=>r.reason==='no-source'),'会議録なし'],
    [n(r=>r.ai==='disallowed'),'AIクローラ拒否'],
    [n(r=>r.cmt===true),'委員会記録あり'],
  ];
  $('#stats').innerHTML=cards.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
  const cs=$('#controls');
  const mk=(label,fn)=>{const b=document.createElement('button');b.className='f';b.textContent=label;
    b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';
      cs.querySelectorAll('button.f').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed',on?'false':'true'); filter=on?null:fn; render();};
    b.setAttribute('aria-pressed','false'); cs.appendChild(b);};
  mk('取得対象のみ',r=>r.eligible);
  mk('除外のみ',r=>!r.eligible);
  mk('許諾で解除可',r=>r.revisit);
  FAMS.forEach(f=>mk(f,r=>r.fam===f));
}

$('#q').oninput=e=>{q=e.target.value;render()};
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; sortAsc = (k===sortK)? !sortAsc : true; sortK=k; render();
});
$('#meta').textContent=`${META.generatedAt} 実測 / ${META.note.slice(0,90)}…`;
$('#foot').innerHTML=`<b>fetchPolicy</b>: ${META.fetchPolicy.rule}<br><br>`+
  Object.entries(META.fetchPolicy.reasons).map(([k,v])=>`<code>${k}</code> — ${v}`).join('<br>');
stats(); render();
</script>
</body>
</html>
