version: 2

sources:
  # 取得の単位（団体コード, 年度, direction）ごとに1ソース。
  # **団体ごとに列が違う**（三鷹市には事項があり多摩市には無い）ので、
  # 団体をまたいで1つのソースにはできない。団体を足すときはこのブロックを足す。
  - name: raw_132047
    description: 三鷹市。原典の Parquet を直接読む
    meta:
      external_location: "read_parquet('../data/budget/raw/jurisdiction=132047/year=*/phase=*/direction={name}/data.parquet', hive_partitioning=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132195
    description: 狛江市。原典の Parquet を直接読む（決算書。2018〜2023 の6年度）
    meta:
      external_location: "read_parquet('../data/budget/raw/jurisdiction=132195/year=*/phase=*/direction={name}/data.parquet', hive_partitioning=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132241
    description: 多摩市。原典の Parquet を直接読む（当初予算。2021〜2022 の2年度）
    meta:
      external_location: "read_parquet('../data/budget/raw/jurisdiction=132241/year=*/phase=*/direction={name}/data.parquet', hive_partitioning=true)"
    tables:
      - name: expenditure
      - name: revenue
  - name: raw_132195_project_names
    description: |
      狛江市。決算資料 PDF から起こした事業名。**原典そのものではない。**
      ⚠️ 抽出は不可逆なので、CSV のような復元一致の検査ができない。
      保証の強さは証跡（`verification: hierarchy-totals`）に書いてある。
    meta:
      external_location: "read_parquet('../data/budget/raw/project-names/jurisdiction=132195/year=*/data.parquet', hive_partitioning=true)"
    tables:
      - name: data

  - name: raw_132195_revenue_accounts
    description: |
      狛江市。決算資料の歳入事項別明細から起こした歳入の科目名称。**原典そのものではない。**
      ⚠️ 2023 はテキスト抽出、2020〜2022 は OCR（誤読が混ざる前提の経路）。
      調定額が原典 CSV と一致した科目だけを下流が名称に使う。
    meta:
      external_location: "read_parquet('../data/budget/raw/revenue-accounts/jurisdiction=132195/year=*/data.parquet', hive_partitioning=true)"
    tables:
      - name: data
