version: 2

models:
  - name: stg_132047__expenditure
    description: 三鷹市 歳出。原典と1対1。判断を含まない
    columns:
      - name: source_row
        description: |
          原典の行番号（ヘッダを1行目とする）。**1リソース内でしか一意でない。**
          年度をまたぐと衝突するので、join にも一意性検査にも使わない（証跡として持つだけ）。
        data_tests: [not_null]
      - name: source_amount
        description: 原典の値。単位は千円のまま
        data_tests: [not_null]
      - name: budget_line_id
        description: |
          安定キー。**公開 API の一部**なので導出を変えると配布済みの参照が壊れる。
          コードのパスではなくセル全文から導く（細々節は兄弟間でコードを再利用するため）。
        data_tests: [unique, not_null]

  - name: stg_132047__revenue
    description: 三鷹市 歳入。原典と1対1。判断を含まない
    columns:
      - name: source_row
        data_tests: [not_null]
      - name: source_amount
        data_tests: [not_null]
      - name: budget_line_id
        data_tests: [unique, not_null]
