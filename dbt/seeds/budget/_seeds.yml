version: 2

seeds:
  - name: cofog_rules
    meta:
      # **判断そのもの。** これを適用した下流は fudoki の言い分を含む。
      role: judgment-rule
    description: |
      COFOG の割り当て規則。**fudoki の判断そのもの**なのでデータとして持つ。
      priority の小さい順に見て最初に当たったものを採る（具体的な規則ほど先）。
      applies_to が空の規則は法定語彙（款・節）にだけ当たるので、どの団体にも効く。
      ⚠️ **名称で当たらない団体がある。** 狛江市は款・項・目に名称の列が原典に無いので、
      名称を条件にした規則は1本も当たらない。名称を捏造せず `match_kan_code` で当て、
      何の款かとその出所を basis に書く。
    config:
      # 団体コードは数値ではなく識別子。推論に任せると先頭ゼロが落ち、
      # match_* も値によって型が揺れる。
      column_types:
        priority: integer
        rule_id: varchar
        applies_to: varchar
        match_fund: varchar
        match_kan: varchar
        match_kou: varchar
        match_kan_code: varchar
        match_moku: varchar
        moku_mode: varchar
        match_setsu: varchar
        status: varchar
        division: varchar
        consolidation: varchar
        decided_at_level: varchar
        counterpart_fund: varchar
        basis: varchar
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: priority
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [assigned, unclassifiable, out-of-scope]
      - name: consolidation
        data_tests:
          - accepted_values:
              values: [retained, eliminated]

  - name: account_master
    meta:
      role: legal-reference
    description: |
      法定の科目マスタ。地方自治法施行規則 別記「歳入歳出予算の款項の区分及び目の区分」
      （第15条関係）の市町村・歳出の表を原文の PDF から起こしたもの
      （`ingestion/budget/fetch_account_master.py` が生成。手で編集しない）。
      **なぜ要るか: 款のコードは団体ごとにずれている。** 法定の款11は災害復旧費だが、
      それを持たない三鷹市・狛江市はどちらも 11 が公債費で、以降が詰まっている。
      コードでは団体をまたいで比較できないので、このマスタと対応表（account_map）を介す。
      ⚠️ 適用範囲は**一般会計だけ**（様式の備考6: 特別会計は長が定めた区分による）。
      is_personnel_moku は様式の※印（一般職の給料・職員手当等・共済費を計上する目。備考2）。
    config:
      column_types:
        direction: varchar
        kan_code: integer
        kan_name: varchar
        kou_code: integer
        kou_name: varchar
        moku_code: integer
        moku_name: varchar
        is_personnel_moku: boolean
        basis: varchar

  - name: account_map
    meta:
      role: judgment-rule
    description: |
      団体の科目コード・名称と法定マスタ（account_master）の対応。**fudoki の判断。**
      kind=map はマスタの区分と同じだと決めたもの、kind=addition は法定に無い
      団体固有の追加区分（施行規則の備考1が行政権能の差による追加を認めている）、
      kind=historical は現行様式から削除された旧法定区分（例: 自動車取得税交付金）。
      款の対応行は kou_name が空。項の行は自動対応（名称の完全一致）で決まらないものだけ持つ。
      ⚠️ **ここに無い款が一般会計の歳出に現れたらパイプラインが止まる**
      （tests/account_map_covers_lines.sql）。黙って未対応のまま配らないため。
    config:
      column_types:
        jurisdiction_code: varchar
        direction: varchar
        kan_code: varchar
        kou_name: varchar
        kind: varchar
        master_kan_code: integer
        master_kou_code: integer
        basis: varchar
