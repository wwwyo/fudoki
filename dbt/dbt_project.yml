name: fudoki
version: "0.1.0"
profile: fudoki
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  fudoki:
    staging:
      # 実体を持たせる。view にすると Parquet への相対パスが dbt の作業ディレクトリに
      # 縛られ、他所から DuckDB を開いたときに解決できない。
      # DuckDB 自体が捨てられるビルド生成物なので、自己完結させたほうがよい。
      +materialized: table
    core:
      +materialized: table
